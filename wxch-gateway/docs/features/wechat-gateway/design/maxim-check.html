    <script id="markdown-raw" type="text/markdown"># [Epic E23] 每日格言打卡 · 完整前后端与数据库设计方案

## 一、 背景与约束说明

根据格言打卡与股市日记的功能需求，以及最新的业务调整说明，本方案作为前后端与数据库接口开发的完整设计文档，遵循以下设计约束：

1. **手工录入与复制粘贴**：系统不采用复杂的第三方爬虫或自动化导入，所有格言内容均由用户在小程序端手工录入（支持复制粘贴）。前端提供添加页面，后端提供格言创建接口。
2. **从零开始，无需初始化**：数据库上线时格言库为空，无需预置底座数据。前后端必须具备高度的健壮性，完美兼容“零格言”以及“格言极少”的极端冷启动场景。
3. **解读按次数累积且非金句**：用户可以对同一条格言进行多次打卡，每次打卡的见解/解读会作为独立的随笔日记进行持久化，并在格言关联表上累加解读计数。解读本身不属于金句库（金句库仅存放格言本体）。
4. **本次只涉及后端数据库和接口开发**：虽然保留前端需求以供未来参考和联调，但本次开发实施仅聚焦于后端 MySQL 表结构设计、API 接口实现及核心加权算法。

---

## 二、 用户故事与前端交互需求 (User Stories & Front-end Requirements)

### E23-S1 手工录入与添加格言
**作为** 用户  
**我希望** 能在手机小程序端方便地手动录入、粘贴复制我喜欢的投资格言  
**以便** 随着我的阅读，逐步充实我个人的投资智慧格言库

#### 任务
- [ ] T1: 【前端】开发“我也想加一条”录入页面，支持用户输入 10-500 字的正文、作者、分类及来源，支持一键粘贴。
- [ ] T2: 【后端】开发格言创建接口 `POST /api/v1/checkin/maxim/quote`，将格言写入 `diary_quote_lib`。
- [ ] T3: 【容错】格言表 `diary_quote_lib` 基础数据上线从零开始，无需预置初始化数据。

#### 验收标准 (AC)
##### AC1 手工录入成功落库
- **Given** 用户打开“我也想加一条”格言录入页
- **When** 输入内容并点击提交时
- **Then** 接口返回成功，`diary_quote_lib` 成功写入一条数据，且 `owner_user_id` 自动标记为当前用户。

##### AC2 字符长度及内容防空校验
- **Given** 用户手工录入一条为空或只有 5 个字符的格言
- **When** 尝试提交时
- **Then** 前后端均应触发校验拦截，提示“格言内容字数必须在 10-500 字之间”。

---

### E23-S2 每日格言轮询与锁定
**作为** 用户  
**我希望** 每天首次进入打卡时自动锁定一条近期未曝光的格言，并且在格言库为空时给予友好引导  
**以便** 获得舒适、无闪烁、不崩溃的打卡体验

#### 任务
- [ ] T1: 【后端】编写排重门禁逻辑，自动排除 30 天内已曝光过的格言、被标记永久屏蔽的格言。
- [ ] T2: 【后端】编写基于今日大盘涨跌的动态权重加分算法，并选取 Top 10 进行加权随机抽取。
- [ ] T3: 【后端】编写凌晨 4:00 后台业务日期切分与任务锁定机制，避免用户日内重新进入页面时格言发生刷新闪烁。
- [ ] T4: 【容错】编写格言库“零数据”容错机制。若库为空，返回 `quote: null` 与 `msg: EMPTY_LIB`，不引发白屏崩溃。
- [ ] T5: 【前端】当今日格言接口返回 `EMPTY_LIB` 时，前端优雅展示“请录入您的第一条投资格言”引导卡片。

#### 验收标准 (AC)
##### AC1 日内锁定防闪烁
- **Given** 用户在 16:00 首次进入打卡页，系统抽取并锁定了格言 A
- **When** 退出小程序并于 20:00 重新进入时
- **Then** 页面展示的必须是同一条格言 A，绝对不发生内容闪烁或重新抽取。

##### AC2 空格言库柔性容错
- **Given** 系统新上线，格言库 `diary_quote_lib` 记录数正好为 0
- **When** 用户进入格言打卡页面时
- **Then** 接口返回 `200 OK` 伴随状态码 `EMPTY_LIB`，小程序不崩溃，而是展示高级感空状态及“去录入第一条格言”的按钮。

---

### E23-S3 格言卡片展示与历史见解对照
**作为** 用户  
**我希望** 格言卡片排版精致有仪式感，且输入框上方能对比展示自己上一次对该格言的感悟见解  
**以便** 直观感受自己对同一条格言在不同时期认知上的演进

#### 任务
- [ ] T1: 【前端】使用衬线字体渲染格言卡片，顶部展示分类徽章，底部展示作者与来源。
- [ ] T2: 【后端】在获取今日待打卡格言接口中，查询并返回用户最近一次对该 `quote_id` 写过的解读内容。
- [ ] T3: 【前端】在输入框上方以磨砂玻璃质感卡片高对比展示“上一次的见解”。

#### 验收标准 (AC)
##### AC1 历史见解对照呈现
- **Given** 用户在一个月前曾对格言 A 提交过一段见解
- **When** 今日再次抽中格言 A 且用户点击输入框准备书写时
- **Then** 输入框上方必须以卡片形式完整显示一个月前的那段见解，并标注当时的日期。

---

### E23-S4 见解输入引导与脚手架
**作为** 用户  
**我希望** 在书写见解时有字数限制门禁和思考脚手架快捷词  
**以便** 在卡壳时迅速组织文字，输出高质量反思

#### 任务
- [ ] T1: 【前端】配置根据格言分类个性化的 placeholder 问题引导。
- [ ] T2: 【前端/后端】设定最低 30 字强制门禁、50-100 字深度见解高亮，以及 500 字上限提示。
- [ ] T3: 【前端】在输入框下方设计 4 个思考脚手架快捷词 Chip（「举个例子」、「反对一下」、「联系当下」、「未来怎么做」）。
- [ ] T4: 【前端】实现点击快捷词 Chip 自动在光标位置插入引导句（如：“比如有一次，我...”）并自动聚焦。

#### 验收标准 (AC)
##### AC1 最低字数硬门禁
- **Given** 用户在输入框中仅写了 15 个字
- **When** 尝试点击提交打卡时
- **Then** 提交按钮保持灰色禁用状态，且接口对少于 30 字的请求直接拦截报错。

---

### E23-S5 收藏与共建
**作为** 用户  
**我希望** 能一键收藏打动我的格言，并能随时修改其权重  
**以便** 让系统中的曝光率越来越个性化

#### 任务
- [ ] T1: 【前端】在卡片下方设计“⭐ 收藏格言”按钮，支持收藏状态的实时双向切换。
- [ ] T2: 【后端】在 `diary_quote_user_state` 中记录收藏状态，被收藏的格言在算法加分中自动获得 +20 的高权重分。

#### 验收标准 (AC)
##### AC1 收藏状态持久化与加权
- **Given** 用户点击收藏当前格言
- **When** 数据库更新成功，且后续重新计算该格言轮询得分时
- **Then** 其最终得分自动获得 +20 收藏加成，页面展示为已收藏金色星星。

---

### E23-S6 跳过与永久屏蔽
**作为** 用户  
**我希望** 能跳过今天不想解读的格言，或永久屏蔽我不认同的理论  
**以便** 保持打卡的舒适度和自主权

#### 任务
- [ ] T1: 【前端】右上角设计“跳过”按钮，点击跳过当日，该格言加入连续跳过计数。
- [ ] T2: 【后端】编写跳过惩罚逻辑：若同一条格言被连续跳过，权重进行相应扣减，避免短期内频繁曝光。
- [ ] T3: 【前端/后端】设计“不喜欢/永久屏蔽”操作，将此格言对当前用户的 `is_disliked` 状态置为 `1`，从此永久在候选池中消隐。

#### 验收标准 (AC)
##### AC1 永久屏蔽生效
- **Given** 用户对格言 B 点击“不喜欢这条”并确认
- **When** 接口将其 `is_disliked` 更新为 `1` 后
- **Then** 格言 B 将从此在曝光候选池中永久过滤。

---

### E23-S7 打卡日记产物生成 (多度解读累加)
**作为** 用户  
**我希望** 每次提交解读打卡时自动生成一篇独立的随笔日记，且原格言记录累加解读次数  
**以便** 沉淀我的投资思考资产，且格言解读次数能按次数正常累加

#### 任务
- [ ] T1: 【后端】编写数据转换逻辑，自动将打卡见解拼装为标准的 Markdown 格式正文。
- [ ] T2: 【后端】生成精炼标题，格式为：“格言解读 · [作者] · [格言开头前10字]”。
- [ ] T3: 【后端】将新日记的 `is_checkin` 赋值为 `1`，`checkin_type` 赋值为 `2`，`entry_type` 设定为 `5` (随笔类)。
- [ ] T4: 【后端】打卡提交事务中，同步使 `diary_quote_user_state` 表中的 `insight_count` 累加 1。

#### 验收标准 (AC)
##### AC1 随笔日记落库与解读计数累加
- **Given** 用户针对格言 A 提交了第 3 次解读见解
- **When** 保存接口调用成功后
- **Then** `diary_entry` 表新增一条随笔记录，且 `diary_quote_user_state` 表中格言 A 的 `insight_count` 必须精确变更为 3。

---

### E23-S8 历史见解聚合时间轴
**作为** 用户  
**我希望** 能够查看我对同一条格言在不同时期写下的所有历史感悟  
**以便** 极其直观地目睹自己交易哲学的演进与心智成长

#### 任务
- [ ] T1: 【前端】提供“我和这句话的故事”按钮，点击跳转至见解聚合时间轴页面。
- [ ] T2: 【后端】开发时间轴数据聚合接口 `GET /api/v1/checkin/maxim/timeline`，根据 `quote_id` 倒序拉取该用户的所有历史格言打卡随笔日记。

#### 验收标准 (AC)
##### AC1 时间轴数据倒序排列
- **Given** 用户对格言 A 曾在 4 月和 5 月写过两次感悟
- **When** 点击进入时间轴页面时
- **Then** 页面成功倒序呈现 2 条解读记录，显示出每次的具体见解内容。

---

## 三、 数据库表结构设计 (MySQL 5.7)

本次数据库设计采用三表分离架构（格言库表、个性化状态表、打卡锁定表），并与主系统的日记实体表无缝整合。

### 1. 格言词库主表 `diary_quote_lib`
```sql
CREATE TABLE `diary_quote_lib` (
  `id` bigint(20) NOT NULL AUTO_INCREMENT COMMENT '格言唯一主键',
  `owner_user_id` bigint(20) NOT NULL DEFAULT '1' COMMENT '归属用户ID(MVP自用版默认为1)',
  `content` text NOT NULL COMMENT '格言正文',
  `source_author` varchar(64) DEFAULT NULL COMMENT '格言原作者(如巴菲特、芒格等，未知可为空)',
  `source_book` varchar(128) DEFAULT NULL COMMENT '来源书籍、文章或媒体渠道',
  `category` tinyint(4) NOT NULL DEFAULT '1' COMMENT '1=经典名言, 2=大佬语录, 3=历史教训, 4=用户摘录, 5=自己写的金句',

## 四、 后端接口设计 (API Specification)

所有接口统一采用异步 FastAPI 框架规范，前缀为 `/api/v1`。

### 1. 新增格言 (手工录入)
用户在小程序端输入或粘贴复制内容后，调用此接口录入金句库。
*   **接口**：`POST /api/v1/checkin/maxim/quote`
*   **请求体**：

## 五、 核心业务逻辑与算法设计

### 1. 凌晨 4:00 业务日期切分逻辑
为支持深夜或凌晨打卡习惯，自然日的 00:00 - 04:00 仍归属为前一交易日的业务日期：
```python
from datetime import datetime, timedelta, date

def get_business_date() -> date:
    now = datetime.now()  # Asia/Shanghai 时区
    if now.hour < 4:
        # 凌晨 4:00 前计入前一天
        return (now - timedelta(days=1)).date()
    return now.date()
```

### 2. 智能轮询及动态加权排序算法 (Quote Selector)
在获取今日待打卡格言时，若今日未锁定，则触发本算法：

```python
async def select_daily_quote(user_id: int) -> int:
    # 1. 查询用户已永久屏蔽(is_disliked=1)的格言ID列表
    # 2. 查询用户在最近 30 天内曝光过(last_exposed_at >= now - 30 days)的格言ID列表
    
    # 3. 从 diary_quote_lib 中过滤掉上述格言，并限制 owner_user_id = user_id
    #    SELECT * FROM diary_quote_lib WHERE is_deleted=0 AND owner_user_id = :user_id
    #    AND id NOT IN (屏蔽列表 + 30天曝光列表)
    
    # 4. 极端场景兜底防护 (Graceful Degradation):
    #    A. 若候选池完全为空 (格言总数较少，且30天内都被曝光过了):
    #       - 则无视“30天排重”，重新拉取未被屏蔽的所有格言候选。
    #    B. 若重新拉取后候选池依然为空 (用户手工金句库彻底为空，新上线无数据):
    #       - 接口终止算法，直接向前端返回 "EMPTY_LIB" 状态，引导用户手动录入第一条格言。

    # 5. 动态加权计算:
    #    针对候选池中的每一条格言，拉取其 diary_quote_user_state 记录:
    #    W_i = base_weight
    #    - 若 is_favorited = 1: W_i += 20 (收藏加成)
    #    - 若 consecutive_skip_count > 0: W_i -= (consecutive_skip_count * 15)  (跳过惩罚)
    #    - 获取今日大盘行情(上证指数变动 pct_chg):
    #      若今日暴跌(pct_chg <= -0.015) 且格言 meta 含有 "discipline" 或 "fear" 标签: W_i += 15
    #      若今日暴涨(pct_chg >= 0.015) 且格言 meta 含有 "greed" 或 "risk_control" 标签: W_i += 15
    
    # 6. 选择决策:
    #    - 将候选格言按最终权重 W_i 降序排列。
    #    - 取出权重最高的前 10 条 (若不足10条，则全部取出)。
    #    - 从这 Top 10 中进行均匀随机抽取一条，作为今日锁定格言，返回其 ID。
```

### 3. 打卡提交与日记实体生成逻辑
当用户提交打卡时，将解读与格言正文组装为 Markdown 存入日记，并执行原子级更新：

```python
async def submit_maxim_checkin(user_id: int, quote_id: int, insight: str, mood: int):
    # 1. 检验字数是否满足最低 30 字
    if len(insight) < 30:
        raise ValueError("解读字数不得少于30字")
        
    # 2. 查询格言正文与作者
    quote = await db.fetch_one("SELECT content, source_author, source_book FROM diary_quote_lib WHERE id = :id", {"id": quote_id})
    
    # 3. 组装 Markdown 内容
    markdown_content = (
        f"> **每日格言**\n"
        f"> 「{quote.content}」 —— {quote.source_author or '佚名'}《{quote.source_book or '未记'}》\n\n"
        f"### 我的今日解读反思\n"
        f"{insight}"
    )
    
    # 4. 获取今日行情快照
    market_snapshot = await get_market_summary_json()
    
    # 5. 开启数据库事务
    async with db.transaction():
        # A. 写入 diary_entry 表，生成一条 is_checkin = 1, checkin_type = 2 的随笔记录
        diary_id = await db.execute(
            "INSERT INTO diary_entry (user_id, title, content, entry_date, mood, is_checkin, checkin_type, checkin_target_id, meta) "
            "VALUES (:user_id, :title, :content, :entry_date, :mood, 1, 2, :quote_id, :meta)",
            {
                "user_id": user_id,
                "title": f"格言解读 · {quote.source_author or '佚名'} · {quote.content[:10]}...",
                "content": markdown_content,
                "entry_date": get_business_date(),
                "mood": mood,
                "quote_id": quote_id,
                "meta": market_snapshot
            }
        )
        
        # B. 更新每日打卡锁定表 diary_checkin_lock
        await db.execute(
            "UPDATE diary_checkin_lock SET status = 1, completed_diary_id = :diary_id "
            "WHERE user_id = :user_id AND business_date = :business_date AND checkin_type = 2",
            {
                "diary_id": diary_id,
                "user_id": user_id,
                "business_date": get_business_date()
            }
        )
        
        # C. 更新或新增格言状态计数
        #    如果 diary_quote_user_state 不存在该记录，则 INSERT，存在则 UPDATE：
        #    insight_count = insight_count + 1
        #    若 len(insight) >= 50，则 deep_insight_count = deep_insight_count + 1
        await db.execute(
            "INSERT INTO diary_quote_user_state (user_id, quote_id, insight_count, deep_insight_count, last_exposed_at) "
            "VALUES (:user_id, :quote_id, 1, :is_deep, NOW()) "
            "ON DUPLICATE KEY UPDATE "
            "insight_count = insight_count + 1, "
            "deep_insight_count = deep_insight_count + :is_deep, "
            "last_exposed_at = NOW()",
            {
                "user_id": user_id,
                "quote_id": quote_id,
                "is_deep": 1 if len(insight) >= 50 else 0
            }
        )
        
    return diary_id
```
