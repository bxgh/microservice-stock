    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --surface-hover: #1a1a1a;
            --border: #222222;
            --accent: #eab308;
            --accent-glow: rgba(234, 179, 8, 0.1);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --font-sans: 'Outfit', 'Noto Sans SC', -apple-system, sans-serif;
            --font-serif: 'Noto Serif SC', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Subtle background glow */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            right: 0;
            width: 40vw;
            height: 40vh;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            border-right: 1px solid var(--border);
            background: var(--bg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            z-index: 100;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
            padding: 0.5rem;
            border-radius: 6px;
        }
        .nav-link:hover { color: var(--accent); background: var(--surface); }

        .toc-title {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-left: 0.5rem;
        }
        .toc-title::before {
            content: '';
            width: 3px;
            height: 1rem;
            background: var(--accent);
            border-radius: 2px;
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .toc-item {
            font-size: 0.8rem;
            line-height: 1.3;
        }
        .toc-item a {
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s;
            display: block;
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
        }
        .toc-item a:hover { color: var(--accent); background: var(--surface); }
        .toc-item.level-3 { margin-left: 0.8rem; border-left: 1px solid var(--border); }

        .container {
            max-width: 860px;
            margin: 0 auto 0 260px;
            padding: 3rem 4rem;
            animation: fadeIn 0.6s ease-out;
        }

        @media (max-width: 1024px) {
            .sidebar { width: 220px; padding: 1rem; }
            .container { margin-left: 220px; padding: 2rem; }
        }

        @media (max-width: 800px) {
            .sidebar { position: static; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .container { margin-left: 0; padding: 1.5rem; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        .meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .meta::before {
            content: '';
            width: 20px;
            height: 1px;
            background-color: var(--accent);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .markdown-body {
            background: transparent !important;
            color: var(--text-primary) !important;
            font-family: var(--font-sans) !important;
            font-size: 0.95rem !important;
        }

        .markdown-body h2 {
            font-family: var(--font-serif);
            font-size: 1.5rem !important;
            color: var(--accent) !important;
            border-bottom: 1px solid var(--border) !important;
            padding-bottom: 0.5rem !important;
            margin-top: 2.5rem !important;
            scroll-margin-top: 1rem;
        }

        .markdown-body h3 {
            font-family: var(--font-serif);
            font-size: 1.25rem !important;
            color: var(--text-primary) !important;
            margin-top: 2rem !important;
            scroll-margin-top: 1rem;
        }

        .markdown-body p, .markdown-body li {
            font-size: 0.95rem !important;
            color: var(--text-primary) !important;
        }
        
        .markdown-body pre {
            background-color: #1a1b26 !important; /* Match Tokyo Night Dark */
            border: 1px solid var(--border);
            border-radius: 8px !important;
            padding: 0 !important; /* Code internal handles padding */
            margin: 1.2rem 0 !important;
            overflow: hidden;
        }

        .markdown-body pre code {
            background-color: transparent !important;
            padding: 1.2rem !important;
            display: block;
            font-family: var(--font-mono) !important;
            font-size: 0.85rem !important;
            line-height: 1.5;
        }

        .markdown-body blockquote {
            border-left: 3px solid var(--accent) !important;
            background: var(--surface);
            padding: 0.8rem 1.2rem;
            color: var(--text-secondary) !important;
            margin: 1.2rem 0 !important;
        }

        .markdown-body table {
            background: var(--surface);
            font-size: 0.85rem !important;
            margin: 1.2rem 0 !important;
        }

        footer {
            margin-top: 4rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
