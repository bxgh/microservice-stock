<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>贵州茅台 600519 · 四锚分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   四锚 · 个股终端 · 炭黑 + 琥珀金 · 单屏紧凑版
   ========================================================== */
:root {
  --bg:            #0e0d0b;
  --bg-elev-1:     #15130f;
  --bg-elev-2:     #1c1915;
  --bg-elev-3:     #262119;

  --ink:           #ede3cc;
  --ink-dim:       #b5a98e;
  --ink-mute:      #776d58;
  --ink-whisper:   #4d4538;

  --amber:         #d4a23e;
  --amber-bright:  #f0c968;
  --amber-deep:    #8a6a24;
  --amber-soft:    rgba(212, 162, 62, 0.12);
  --amber-line:    rgba(212, 162, 62, 0.28);

  --hair:          #2a2520;
  --hair-soft:     #1f1c17;

  --s-strong:      #8ab573;
  --s-neutral:     #c99339;
  --s-alert:       #d97a3d;
  --s-weak:        #c85a4a;
  --s-cold:        #6b8ca8;

  --mkt-up:        #e5644f;
  --mkt-down:      #5ca478;

  --mono:          "JetBrains Mono", ui-monospace, monospace;
  --serif-cn:      "Noto Serif SC", "Songti SC", serif;
  --sans-cn:       "Noto Sans SC", "PingFang SC", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--sans-cn);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum";
  background-image:
    radial-gradient(ellipse at 15% 0%, rgba(212,162,62,0.035), transparent 40%),
    radial-gradient(ellipse at 85% 100%, rgba(212,162,62,0.02), transparent 45%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0 0.5  0 0 0 0.02 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  z-index: 0;
  opacity: 0.45;
  mix-blend-mode: screen;
}

.shell {
  position: relative;
  z-index: 1;
  max-width: 1360px;
  margin: 0 auto;
  padding: 0 28px;
}

/* ==========================================================
   TOPBAR — 吸收股票标识
   ========================================================== */
.topbar {
  border-bottom: 1px solid var(--hair);
  background: var(--bg-elev-1);
  position: sticky;
  top: 0;
  z-index: 40;
  backdrop-filter: blur(8px);
}
.topbar-inner {
  max-width: 1360px;
  margin: 0 auto;
  padding: 10px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

/* brand — 更简洁 */
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--serif-cn);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--ink);
}
.brand-glyph {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--amber);
  color: var(--bg);
  font-weight: 900;
  font-size: 13px;
}
.brand-sub {
  color: var(--ink-mute);
  font-weight: 400;
  letter-spacing: 0.15em;
}

.tb-divider {
  width: 1px;
  height: 28px;
  background: var(--hair);
}

/* stock identity in topbar */
.tb-stock {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex: 1;
  min-width: 0;
  flex-wrap: wrap;
}
.tb-name {
  font-family: var(--serif-cn);
  font-weight: 900;
  font-size: 24px;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--ink);
}
.tb-code {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--amber);
  font-weight: 500;
  letter-spacing: 0.04em;
}
.tb-exchange {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
  padding: 2px 7px;
  border: 1px solid var(--hair);
  letter-spacing: 0.15em;
}
.tb-tag {
  font-size: 11px;
  padding: 3px 10px;
  border: 1px solid var(--amber-line);
  color: var(--amber);
  letter-spacing: 0.1em;
  font-family: var(--sans-cn);
}

.tb-meta {
  display: flex;
  gap: 16px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-dim);
  letter-spacing: 0.05em;
  align-items: center;
}
.tb-meta .item { display: flex; gap: 5px; align-items: center; }
.tb-meta .lbl { color: var(--ink-whisper); }

.pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

/* ==========================================================
   ANCHOR NAV
   ========================================================== */
.anchor-nav {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-bottom: 1px solid var(--hair);
  position: sticky;
  top: 49px;
  z-index: 30;
  background: var(--bg);
}
.anchor-tab {
  background: transparent;
  border: none;
  border-right: 1px solid var(--hair);
  padding: 11px 16px;
  cursor: pointer;
  color: var(--ink-dim);
  font-family: var(--sans-cn);
  transition: background .2s, color .2s;
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
}
.anchor-tab:last-child { border-right: none; }
.anchor-tab:hover { background: var(--bg-elev-1); color: var(--ink); }
.anchor-tab::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .3s ease;
}
.anchor-tab.active::after { transform: scaleX(1); }
.anchor-tab.active { background: var(--bg-elev-1); color: var(--ink); }

.anchor-tab-numeral {
  font-family: var(--serif-cn);
  font-weight: 700;
  font-size: 22px;
  color: var(--amber);
  line-height: 1;
  min-width: 22px;
}
.anchor-tab-body { flex: 1; min-width: 0; }
.anchor-tab-name {
  font-family: var(--serif-cn);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.04em;
  line-height: 1.2;
}
.anchor-tab-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-mute);
  margin-top: 3px;
  letter-spacing: 0.02em;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ink-whisper);
  flex-shrink: 0;
}
.status-dot.strong  { background: var(--s-strong);  box-shadow: 0 0 6px var(--s-strong); }
.status-dot.neutral { background: var(--s-neutral); box-shadow: 0 0 6px var(--s-neutral); }
.status-dot.alert   { background: var(--s-alert);   box-shadow: 0 0 6px var(--s-alert); }
.status-dot.weak    { background: var(--s-weak);    box-shadow: 0 0 6px var(--s-weak); }
.status-dot.cold    { background: var(--s-cold);    box-shadow: 0 0 6px var(--s-cold); }
.status-dot.amber   { background: var(--amber);     box-shadow: 0 0 6px var(--amber); }

.anchor-tab.synthesis .anchor-tab-numeral {
  color: var(--amber-bright);
  font-size: 18px;
}

/* ==========================================================
   ANCHOR STAGE
   ========================================================== */
main.anchor-stage {
  padding: 18px 0 14px;
}

.panel { display: none; animation: pin .4s ease; }
.panel.active { display: block; }
@keyframes pin {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ----- compact hero ----- */
.anchor-hero {
  padding: 2px 0 12px;
  border-bottom: 1px solid var(--hair);
  margin-bottom: 14px;
}
.hero-main {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.hero-numeral {
  font-family: var(--serif-cn);
  font-weight: 900;
  font-size: 36px;
  color: var(--amber);
  line-height: 1;
}
.hero-name {
  font-family: var(--serif-cn);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.04em;
  line-height: 1;
}
.hero-headline {
  font-family: var(--serif-cn);
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--ink-dim);
  margin-top: 0;
  flex: 1;
  min-width: 260px;
  padding-left: 16px;
  border-left: 2px solid var(--amber-deep);
  margin-left: 4px;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border: 1px solid currentColor;
  font-size: 11px;
  letter-spacing: 0.15em;
  background: rgba(0,0,0,0.3);
}
.status-chip .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}
.status-chip.strong  { color: var(--s-strong); }
.status-chip.neutral { color: var(--s-neutral); }
.status-chip.alert   { color: var(--s-alert); }
.status-chip.weak    { color: var(--s-weak); }
.status-chip.cold    { color: var(--s-cold); }

/* ----- metrics strip (盈利锚专属) ----- */
.metrics-section {
  margin-bottom: 14px;
}
.metrics-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--amber);
  letter-spacing: 0.15em;
  margin-bottom: 8px;
  font-family: var(--serif-cn);
}
.metrics-label::before {
  content: "◆";
  font-size: 9px;
}
.metrics-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--amber-deep), transparent);
  opacity: 0.5;
}
.metrics-label .muted {
  color: var(--ink-whisper);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.metrics-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border: 1px solid var(--hair);
  background: var(--bg-elev-1);
}
.metric {
  padding: 10px 14px;
  border-right: 1px solid var(--hair);
}
.metric:last-child { border-right: none; }
.metric-lbl {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink-mute);
  margin-bottom: 5px;
}
.metric-val {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 17px;
  line-height: 1;
  color: var(--ink);
}
.metric-val .unit {
  font-size: 10px;
  color: var(--ink-mute);
  margin-left: 2px;
  font-weight: 400;
}
.metric-delta {
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.02em;
}
.metric-delta.down { color: var(--mkt-down); }
.metric-delta.up   { color: var(--mkt-up); }
.metric-delta.flat { color: var(--ink-mute); }

/* ----- body grid ----- */
.anchor-body {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 16px;
  margin-bottom: 14px;
}

/* ----- points block ----- */
.points-block {
  background: var(--bg-elev-1);
  border: 1px solid var(--hair);
  padding: 12px 20px 4px;
}
.block-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 8px;
  margin-bottom: 2px;
  border-bottom: 1px solid var(--hair);
}
.block-title {
  font-family: var(--serif-cn);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.12em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.block-title::before {
  content: "";
  width: 3px;
  height: 13px;
  background: var(--amber);
}
.block-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.05em;
}

.points-list { list-style: none; }
.points-list li {
  padding: 11px 0 11px 28px;
  border-bottom: 1px solid var(--hair-soft);
  position: relative;
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-dim);
}
.points-list li:last-child { border-bottom: none; padding-bottom: 10px; }
.points-list li::before {
  content: attr(data-idx);
  position: absolute;
  left: 0; top: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--amber);
  letter-spacing: 0.08em;
}
.points-list .num {
  font-family: var(--mono);
  color: var(--ink);
  font-weight: 500;
  background: var(--amber-soft);
  padding: 1px 5px;
  margin: 0 1px;
  font-size: 12px;
  border-radius: 1px;
}
.points-list .arrow {
  display: inline-block;
  color: var(--amber);
  margin: 0 6px;
  font-family: var(--mono);
}
.points-list .takeaway {
  color: var(--ink);
  font-weight: 500;
}

/* ----- verdict block ----- */
.verdict-block {
  background: linear-gradient(180deg, var(--bg-elev-2) 0%, var(--bg-elev-1) 100%);
  border: 1px solid var(--amber-line);
  padding: 14px 18px;
  position: relative;
}
.verdict-block::before,
.verdict-block::after {
  content: "";
  position: absolute;
  width: 12px; height: 12px;
  border-color: var(--amber);
  border-style: solid;
  border-width: 0;
}
.verdict-block::before {
  top: -1px; left: -1px;
  border-top-width: 2px; border-left-width: 2px;
}
.verdict-block::after {
  bottom: -1px; right: -1px;
  border-bottom-width: 2px; border-right-width: 2px;
}
.verdict-head {
  font-family: var(--serif-cn);
  font-weight: 500;
  font-size: 12.5px;
  color: var(--amber);
  letter-spacing: 0.15em;
  padding-bottom: 8px;
  margin-bottom: 10px;
  border-bottom: 1px dashed var(--hair);
  display: flex;
  align-items: center;
  gap: 8px;
}
.verdict-head::before {
  content: "◆";
  color: var(--amber);
  font-size: 10px;
}
.verdict-title {
  font-family: var(--serif-cn);
  font-weight: 700;
  font-size: 17px;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}
.verdict-body {
  font-family: var(--serif-cn);
  font-size: 13px;
  line-height: 1.75;
  color: var(--ink-dim);
}
.verdict-body strong { color: var(--amber-bright); font-weight: 500; }

/* grade ladder */
.grade-ladder {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--hair);
}
.grade-ladder-label {
  font-size: 10.5px;
  color: var(--ink-mute);
  letter-spacing: 0.12em;
  margin-bottom: 8px;
}
.grade-track {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.grade-step {
  padding: 7px 4px;
  text-align: center;
  border: 1px solid var(--hair);
  font-family: var(--serif-cn);
  font-weight: 700;
  font-size: 14px;
  color: var(--ink-mute);
}
.grade-step .cn {
  display: block;
  font-family: var(--sans-cn);
  font-weight: 400;
  font-size: 10px;
  color: var(--ink-whisper);
  margin-top: 2px;
  letter-spacing: 0.05em;
}
.grade-step.was {
  text-decoration: line-through;
  text-decoration-color: var(--ink-whisper);
  opacity: 0.55;
}
.grade-step.now {
  color: var(--amber-bright);
  border-color: var(--amber);
  background: var(--amber-soft);
}
.grade-step.now .cn { color: var(--amber); }
.grade-arrow {
  text-align: center;
  color: var(--amber);
  font-family: var(--mono);
  font-size: 10px;
  margin-top: 5px;
  letter-spacing: 0.1em;
}

/* ----- support row ----- */
.support-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--hair);
  border: 1px solid var(--hair);
}
.support-cell {
  background: var(--bg-elev-1);
  padding: 12px 16px;
}
.support-lbl {
  font-size: 10.5px;
  letter-spacing: 0.1em;
  color: var(--ink-mute);
  margin-bottom: 6px;
}
.support-val {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 18px;
  color: var(--ink);
  line-height: 1.1;
}
.support-val .unit {
  font-size: 10.5px;
  color: var(--ink-mute);
  margin-left: 2px;
  font-weight: 400;
}
.support-note {
  font-size: 11px;
  color: var(--ink-mute);
  margin-top: 5px;
  line-height: 1.4;
}

/* ==========================================================
   SYNTHESIS PANEL
   ========================================================== */
.synth-hero {
  padding: 18px 24px;
  border: 1px solid var(--amber-line);
  background:
    linear-gradient(135deg, rgba(212,162,62,0.08) 0%, transparent 55%),
    var(--bg-elev-1);
  position: relative;
  margin-bottom: 14px;
}
.synth-hero::before {
  content: "";
  position: absolute;
  top: 10px; left: 10px; right: 10px;
  height: 1px;
  background: linear-gradient(90deg, var(--amber), transparent 70%);
}
.synth-eyebrow {
  font-family: var(--serif-cn);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.25em;
  color: var(--amber);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.synth-eyebrow::before {
  content: "◆";
  font-size: 9px;
}
.synth-headline {
  font-family: var(--serif-cn);
  font-weight: 700;
  font-size: 22px;
  line-height: 1.45;
  letter-spacing: 0.02em;
  color: var(--ink);
}
.synth-headline .em { color: var(--amber-bright); }

.synth-blocks {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--hair);
  border: 1px solid var(--hair);
}
.synth-block {
  background: var(--bg-elev-1);
  padding: 16px 20px;
}
.synth-block-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--hair);
}
.synth-block-num {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 17px;
  color: var(--amber);
  line-height: 1;
  letter-spacing: 0.04em;
}
.synth-block-name {
  font-family: var(--serif-cn);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.08em;
  color: var(--ink);
}
.synth-block-body {
  font-family: var(--serif-cn);
  font-size: 13px;
  line-height: 1.8;
  color: var(--ink-dim);
}
.synth-block-body strong {
  color: var(--amber-bright);
  font-weight: 500;
}

/* ==========================================================
   BOTTOM NAV — 单行细条
   ========================================================== */
.bottom-nav {
  margin-top: 14px;
  border-top: 1px solid var(--hair);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: stretch;
  background: var(--bg-elev-1);
}
.nav-btn {
  background: transparent;
  border: none;
  padding: 11px 18px;
  cursor: pointer;
  color: var(--ink);
  font-family: var(--sans-cn);
  text-align: left;
  transition: background .2s;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 42px;
  border-right: 1px solid var(--hair);
}
.nav-btn:last-child { border-right: none; border-left: 1px solid var(--hair); }
.nav-btn:hover:not(:disabled) {
  background: var(--bg-elev-2);
  color: var(--amber);
}
.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.nav-btn.next { text-align: right; justify-content: flex-end; }
.nav-btn-direction {
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
}
.nav-btn:hover:not(:disabled) .nav-btn-direction {
  color: var(--amber);
}
.nav-btn-label {
  font-family: var(--serif-cn);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-btn-numeral {

  el.innerHTML = `
    <button class="nav-btn prev" ${prevIdx < 0 ? 'disabled' : ''} data-nav="prev">
      <span class="nav-btn-direction">← 上一锚</span>
      <span class="nav-btn-label">${prevLabel}</span>
    </button>
    <div class="nav-progress">
      <span>${String(currentIndex + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</span>
      <div class="dots">${dots}</div>
    </div>
    <button class="nav-btn next" ${nextIdx >= total ? 'disabled' : ''} data-nav="next">
      <span class="nav-btn-label">${nextLabel}</span>
      <span class="nav-btn-direction">下一锚 →</span>
    </button>
  `;
}

const STATE = { currentId: data.anchors[0].id };

function getCurrentIndex() {
  const ids = [...data.anchors.map(a => a.id), 'synthesis'];
  return ids.indexOf(STATE.currentId);
}

function renderStage() {
  const stage = document.getElementById('anchorStage');
  const idx = getCurrentIndex();
  const ids = [...data.anchors.map(a => a.id), 'synthesis'];
  if (STATE.currentId === 'synthesis') {
    stage.innerHTML = renderSynthesisPanel();
  } else {
    stage.innerHTML = renderAnchorPanel(data.anchors.find(a => a.id === STATE.currentId));
  }
  renderBottomNav(idx, ids.length);
  document.querySelectorAll('.anchor-tab').forEach(tab => {
    tab.classList.toggle('active', tab.getAttribute('data-target') === STATE.currentId);
  });
}

function go(id) {
  STATE.currentId = id;
  renderStage();
  // scroll top back to anchor nav if scrolled
  const nav = document.querySelector('.anchor-nav');
  if (nav) {
    const rect = nav.getBoundingClientRect();
    if (rect.top < 0) {
      window.scrollTo({ top: nav.offsetTop - 50, behavior: 'smooth' });
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderTopbarStock();
  renderAnchorNav();
  renderStage();

  document.getElementById('anchorNav').addEventListener('click', e => {
    const tab = e.target.closest('.anchor-tab');
    if (!tab) return;
    go(tab.getAttribute('data-target'));
  });

  document.getElementById('bottomNav').addEventListener('click', e => {
    const btn = e.target.closest('.nav-btn');
    if (!btn || btn.disabled) return;
    const ids = [...data.anchors.map(a => a.id), 'synthesis'];
    const idx = getCurrentIndex();
    const dir = btn.getAttribute('data-nav');
    if (dir === 'prev' && idx > 0) go(ids[idx - 1]);
    if (dir === 'next' && idx < ids.length - 1) go(ids[idx + 1]);
  });

  document.addEventListener('keydown', e => {
    const ids = [...data.anchors.map(a => a.id), 'synthesis'];
    const idx = getCurrentIndex();
    if (e.key === 'ArrowLeft' && idx > 0) go(ids[idx - 1]);
    if (e.key === 'ArrowRight' && idx < ids.length - 1) go(ids[idx + 1]);
  });

  document.getElementById('asofDate').textContent = data.meta.asOf.replace(/-/g, '·');
});
</script>
</body>
