    <script id="markdown-raw" type="text/markdown">## 一、先想清楚:这个系统要解决什么问题?

很多人搭"政策跟踪"系统会变成"政策新闻聚合器",信息过载反而误事。你的系统要回答的是**5个具体投资问题**:

1. **今天有没有影响我持仓/候选股的政策出来?**(预警)
2. **这次政策表述,和上次有什么细微变化?**(措辞追踪)
3. **类似政策历史上出现过吗?板块当时怎么反应?**(回测)
4. **这次政策最受益/最受损的赛道是哪些?**(映射)
5. **接下来1-3个月,可能有哪些政策窗口?**(日历)

**记住:工具是为决策服务的,不是为"覆盖全面"服务**。

## 三、第1层:数据源(最关键的设计)

**核心原则:宁可少而精,不要多而杂**。建议只抓权威源,**避免一切自媒体、公众号、研报二次解读**——这些信息混杂主观判断,反而污染你的判断。

### 一手政策源(必抓)

| 机构 | 网址 | 抓取频率 | 重要性 |
|---|---|---|---|
| 中国政府网 | gov.cn/zhengce | 每日2次 | ★★★★★ |
| 央行 | pbc.gov.cn | 每日 | ★★★★★ |
| 证监会 | csrc.gov.cn | 每日 | ★★★★★ |
| 金融监管总局 | nfra.gov.cn | 每日 | ★★★★★ |
| 发改委 | ndrc.gov.cn | 每日 | ★★★★ |
| 财政部 | mof.gov.cn | 每周 | ★★★★ |
| 工信部 | miit.gov.cn | 每周 | ★★★★ |
| 国资委 | sasac.gov.cn | 每周 | ★★★ |

### 二手权威解读源(可选)

| 来源 | 用途 |
|---|---|
| 新华社时政 | 高规格讲话首发 |
| 人民日报头版+评论员文章 | 政策风向标 |
| 求是杂志 | 战略性论述 |
| 央行货币政策执行报告 | 季度重磅 |
| 各部委吹风会实录 | 政策解读 |

**绝对不抓的源**:
- 自媒体公众号(噪音、营销、传播二手信息)
- 股吧/雪球(情绪化、不准确)
- 卖方研报(已经经过解读,失去原始信号)
- 个人微博(不权威)

### Trade-off

- 全自动爬虫 vs RSS订阅 vs 手动整理
  - 全自动爬虫:工作量大,易失效,**不推荐个人投资者做**
  - RSS订阅:政府网站很多有RSS,**首推**
  - 手动+脚本:每天花15分钟,**配合自动化更可靠**

## 四、第2-3层:数据处理 + AI分析

### 技术栈(推荐最简方案)

```yaml
# 个人投资者推荐的轻量栈
语言: Python
抓取: requests + BeautifulSoup + (Playwright 仅在必要时)
PDF解析: pdfplumber
中文分词: jieba (足够) 
向量数据库: Chroma (本地)
存储: SQLite (个人项目够用)
LLM调用: 
  - Claude API (复杂分析/长文本)
  - DeepSeek API (性价比高,日常分析)
  - 本地Qwen2.5-14B (隐私+无限制调用)
调度: cron / APScheduler
```

**Trade-off**:
- LLM选择:用Claude/GPT-4成本高但效果好,用DeepSeek性价比高,**本地部署适合大量调用**
- 存储:SQLite 完全够200万规模个人用,**不要上 PostgreSQL,过度工程**
- 不需要 Docker、不需要 K8s、不需要消息队列——**这些都是企业级的过度设计**

### 关键AI能力:5个核心prompt模板

这是整个系统的灵魂。**好的prompt比复杂的代码更重要**。

#### **Prompt 1:政策三句话摘要**

```text
你是政策分析专家。请用三句话概括以下政策文件:
1. 核心内容(做了什么)
2. 关键变化(相比之前有什么新表述/新部署)
3. 主要影响(可能影响哪些行业/赛道)

文件来源:{机构名称}
发布时间:{日期}
原文:{原文}

要求:
- 每句话不超过50字
- 不使用空话套话(如"重要意义"、"高度重视")
- 直接指出可量化的变化(数字、比例、时间表)
```

#### **Prompt 2:措辞变化检测**

```text
你是政策语言学专家。下面是同一议题在两个时点的官方表述,请对比:

【2024年X月X日表述】{文本A}
【2026年X月X日表述】{文本B}

请分析:
1. 措辞强度变化(如"加大"→"加快"→"稳步")
2. 删字、加字、换字
3. 优先级排序变化
4. 隐含的政策方向变化

输出格式:JSON
{
  "intensity_change": "增强/持平/减弱",
  "key_differences": [...],
  "implication": "..."
}
```

#### **Prompt 3:政策-板块映射**

```text
分析下面政策的受益和受损赛道。

政策原文:{原文}

请按以下维度输出:
1. 直接受益赛道(政策明确提及的)
2. 间接受益赛道(产业链上下游)
3. 中性赛道
4. 受损赛道(政策限制/挤压的)
5. A股映射:对应的申万一级行业 + 代表性上市公司3-5只

注意:
- 不要凭空联想,只基于政策原文
- 受损赛道也要明确指出
- 不确定的请标注"待观察"
```

#### **Prompt 4:历史类比检索**

```text
我需要在历史政策库中找到类似的政策。

当前政策:{原文}

请提取这个政策的关键特征,用于在历史政策库中检索:
1. 主题分类(货币政策/财政政策/产业政策/监管政策/...)
2. 关键词(5-10个)
3. 涉及的核心机构
4. 政策力度(强/中/弱)

输出格式:用于向量检索的查询语句
```

#### **Prompt 5:重要性评级**

```text
基于以下维度对这条政策评级(1-5星):

1. 发文机构级别(中央/部委/地方)
2. 文件性质(讲话/法规/通知/答记者问)
3. 涉及范围(全国/局部/试点)
4. 资金/规模量级
5. 历史对照(类似政策的市场反应)

政策内容:{原文}

输出:
- 评级:N星
- 评级理由:30字内
- 建议关注度:重点关注/一般关注/参考
```

## 五、第4层:知识库设计

### 政策历史数据库

```sql
-- SQLite schema 示例
CREATE TABLE policies (
    id INTEGER PRIMARY KEY,
    publish_date DATE,
    source TEXT,  -- 发文机构
    title TEXT,
    url TEXT,
    raw_content TEXT,  -- 原文
    summary TEXT,  -- LLM三句话摘要
    keywords TEXT,  -- JSON数组
    importance INTEGER,  -- 1-5星
    sectors_positive TEXT,  -- JSON数组,受益板块
    sectors_negative TEXT,  -- JSON数组,受损板块
    created_at TIMESTAMP
);

CREATE TABLE policy_market_reactions (
    policy_id INTEGER,
    sector_code TEXT,  -- 申万一级
    return_1d REAL,
    return_5d REAL,
    return_30d REAL,
    return_90d REAL,
    FOREIGN KEY(policy_id) REFERENCES policies(id)
);
```

### 政策-板块映射表(需要你手工建立基础版)

| 政策关键词 | 申万一级 | 申万二级 | 代表标的 |
|---|---|---|---|
| 科技金融 | 计算机/电子 | 半导体/软件 | 寒武纪/中际旭创/海光信息 |
| 绿色金融 | 电力设备/公用事业 | 光伏/储能 | 隆基/阳光/宁德 |
| 普惠金融 | 银行 | 城商行 | 江苏银行/宁波银行 |
| 五篇大文章-养老 | 保险/医药 | 保险/CXO | 中国人寿/药明康德 |
| 新质生产力 | 计算机/机械/军工 | AI/机器人 | ... |

**这个表是你的核心知识资产,持续维护**。

## 六、第5层:决策辅助(系统的真正价值)

### 5个具体功能

#### **功能1:每日简报**(最常用)

每天早上8点自动生成:

```
=== 2026-05-17 政策日报 ===

【★★★★★ 重大】
- 国务院常务会议 提到xxxx
- 央行发布xxx文件,核心变化:xxx
  对应板块:xxx (申万xxx)
  涉及标的(你的候选清单):xxxx

【★★★ 一般】
- 工信部xxx
- 发改委xxx

【关注预警】
- 措辞变化:某文件中"积极推进"→"稳慎推进"
  历史类比:2021年同样表述出现后,xx板块30天-12%

【未来一周政策日历】
- 5月20日 LPR利率决议
- 5月22日 xxx发布会
```

#### **功能2:措辞变化告警**

当**关键议题的核心表述**发生变化时自动告警。这是**最有价值的功能**——大部分人看不到的细节。

例子:
- "降准空间充足" → "存款准备金率仍有下调空间" (强度↓)
- "防资金空转" 首次出现 → 历史类比2017年金融去杠杆
- "稳慎扎实推进人民币国际化" → 删除"稳慎",变成"扎实推进" (强度↑)

#### **功能3:政策回测**

输入新政策,自动检索3-5个历史相似案例,看当时**板块在事件后的1天/5天/30天/90天表现**。

这一步**最难也最值钱**——能告诉你"市场过去如何price-in这类政策"。

#### **功能4:政策日历**

预测未来1-3个月的政策窗口(基于历史规律):
- 每月15日左右:LPR利率决议
- 每季度末:货币政策执行报告
- 7月底/12月初:中央政治局会议(经济)
- 7月中:中央政治局会议(年中)
- 10月底/11月初:四中全会(2026年是十五五规划)
- 12月中下旬:中央经济工作会议
- 3月初:两会

#### **功能5:政策-持仓影响图**

对你的持仓和候选清单,自动评估每条新政策的"影响分":+5(强利好)到-5(强利空)。

## 七、MVP路径:不要一上来就建完整系统

**关键原则:先用,再优化**。

### **Week 1-2:最小可用版本**

只做3件事:
1. 用RSS+脚本,每天抓取5个核心源(政府网+央行+证监会+金融监管总局+发改委)
2. 用Claude/DeepSeek API,对每条政策做"三句话摘要+板块映射"
3. 每天早上自动发送一封邮件汇总给自己

**代码量:200行以内,1-2天可完成**。

### **Month 1:增强版**

- 加入历史政策库(用你过去2年的政策做种子)
- 加入措辞变化检测(选3-5个核心议题)
- 加入重要性评级
- 输出格式从邮件升级为Markdown文档+本地可查

### **Month 2:进阶**

- 加入政策-板块回测(用申万指数日线数据)
- 建立你自己的政策-标的映射表
- 加入异常预警

### **Month 3+:精细化**

- 个性化推送(针对你的持仓和候选清单)
- 政策日历预测
- 多源信息交叉验证

**警告:不要追求"完美自动化"。每个环节做到80%就行,把节省的时间放在读政策原文+做投资判断上**。

## 八、常见陷阱(踩过你才信)

### 陷阱1:过度依赖LLM摘要

**问题**:LLM会忽略你认为重要的细节,会"打太极"式总结
**对策**:重要政策**必须人工读原文**,LLM只做初筛和归档

### 陷阱2:抓得太多,看不完

**问题**:每天50条政策,反而没法消化
**对策**:用重要性评级硬切——**只看4星以上**,其他归档备查

### 陷阱3:过度解读

**问题**:把每条政策都"映射到板块",形成虚假因果
**对策**:大部分政策对短期市场无影响,**敢于说"无明显影响"**

### 陷阱4:回测过拟合

**问题**:历史相似政策样本太少,统计意义弱
**对策**:回测结果只作为参考,**不要作为决策依据**

### 陷阱5:工具化倾向

**问题**:沉迷于建系统,反而不读政策原文
**对策**:**70%时间读+思考,30%时间建工具**

### 陷阱6:政府网站反爬

**问题**:频率太高会被封IP
**对策**:每5-10分钟一次,加User-Agent轮换,**优先用RSS**

## 十、最后的真心话

你可能会发现:**搭建这个系统的过程,本身就是最好的政策学习**。

你会:
- 知道哪些机构发文最多
- 看清政策表述的"黑话"
- 理解政府工作的内在节奏
- 建立对宏观政策的肌肉记忆

**但更要记住:工具最终是为决策服务的。如果你花了3个月建系统,却没做出一笔好投资,这个系统就是失败的**。

我的具体建议:**用1个月做Week 1-Month 1的版本就够用,剩下的精力放在读原文和建立自己的政策判断框架上**。

        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
