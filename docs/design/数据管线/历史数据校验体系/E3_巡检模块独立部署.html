    <script id="markdown-raw" type="text/markdown"># E3: 巡检模块独立部署(P0)

> 这是原文重点,但要明确边界:巡检只做"发现问题",修复交给 E6。

## Story E3-S1: 部署独立巡检节点

* **物理隔离**:不要和日常采集服务跑在同一台机器
* 推荐放在内网 NAS / 自有 PC / 性能稍好的边缘节点
* 调度时间避开交易时段和日常采集窗口(建议每日凌晨 2:00–5:00)

## Story E3-S2: 实现三类核心巡检

**完整性巡检**(每日凌晨执行):
* 输入:交易日历 + 全量股票池
* 逻辑:预期记录数 vs 实际记录数,缺口超过阈值告警
* 输出:每日完整性报告

**连续性巡检**(每日凌晨执行):
* 逻辑:对每只股票按日期排序,找断档
* 排除项:停牌期、退市后、上市前
* 输出:疑似缺失的 `(ts_code, date)` 列表

**停牌一致性巡检**(每日凌晨执行):
* 逻辑:`meta_suspension` 表中标记停牌的日期,日线表必须没有数据;反之亦然
* 输出:不一致清单

## Story E3-S3: 巡检结果落表 + 通知

* 所有发现的问题写入 `dq_findings` 表,带发现时间、规则、严重等级
* 严重问题(完整性 < 99%)立即推送(微信 / 邮件)
* 一般问题汇总到日报

* `dq_findings` 表可追溯每个问题的发现链路

## 实施记录 (Implementation)

### 1. 核心探测器 (2026-05-01)
已实现 [readiness_prober_job](../../../stock-manager-api/app/scheduler/system_jobs.py)，核心特性包括：
- **动态校准**: 自动根据当日上市股票总数设定 98% 的就绪阈值。
- **状态追踪**: 巡检结果落库 `meta_data_readiness` 表，记录 `READY`, `PARTIAL`, `PENDING` 状态。
- **压制机制**: 仅在 19:00 - 23:00 窗口期执行探测，且对已就绪日期采用内存缓存压制。

### 2. 日终审计
- 实现 [daily_audit_job](../../../stock-manager-api/app/scheduler/system_jobs.py)，每日 23:30 检查核心表（`stock_kline_daily`, `ads_l1_market_overview`）的最终就绪状态。
- **告警触发**: 若核心表未达到 `READY` 状态，触发 `alerter` 告警。

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
