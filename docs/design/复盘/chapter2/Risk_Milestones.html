    <script id="markdown-raw" type="text/markdown"># 第 2 章 · 风险与里程碑

## 风险与避坑指南

### 1. 数据质量类
- **申万行业 2021 改版**: 2021-12-13 之前的历史回补需注意 28 与 31 行业的差异。
- **概念板块“未来函数”**: 同花顺动态调整概念成分。做历史回溯时, 2024 年的数据用的是 2026 年的成分快照, 存在无法完全消除的偏差。
- **行业领涨股失真**: 小众行业(只有 2-3 只股)的领涨股参考价值低。

### 2. 技术性能类
- **MySQL 5.7 窗口函数**: 严禁直接使用 `ROW_NUMBER()`, 必须使用变量模拟(参考 E2)。
- **相关子查询性能**: 5 年历史回补计算时, 估值分位数 SQL 可能运行极慢, 建议按月/年分段执行。
- **JSON 字段限制**: `top_stocks` 使用 JSON 存储, 方便前端展示但不利于 SQL 复杂分析, 核心逻辑应基于 ODS 原始表。

---

## 实施里程碑

- **D1-D3**: 完成 E1 所有建表与风格因子配置初始化。
- **D4-D8**: 实现 akshare 采集脚本, 完成 31 个申万一级行业历史补全。
- **D9-D15**: 概念板块历史补全(优先近 3 年)。
- **D16-D18**: 执行 E2 聚合 SQL, 生成 ADS 历史指标。
- **D19-D20**: 数据接口校验, 配合前端完成联调。

---

## 度量指标 (KPI)

1. **执行成功率**: 建表与初始化 SQL 100% 通过。
2. **数据完整性**: 申万一级行业历史(近 5 年)缺失率 < 1%。
3. **计算性能**: 单个交易日 L2 聚合耗时 < 10s (本地 VPS)。
</script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
