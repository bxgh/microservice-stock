    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --surface-hover: #1a1a1a;
            --border: #222222;
            --accent: #eab308;
            --accent-glow: rgba(234, 179, 8, 0.1);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

        * {

            margin: 0;
            padding: 0;

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.7;

            top: 0;
            right: 0;
            width: 40vw;
            height: 40vh;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            border-right: 1px solid var(--border);
            background: var(--bg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            z-index: 100;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
            padding: 0.5rem;
            border-radius: 6px;
        }
        .nav-link:hover { color: var(--accent); background: var(--surface); }

        .toc-title {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-left: 0.5rem;
        }
        .toc-title::before {
            content: '';
            width: 3px;
            height: 1rem;
            background: var(--accent);
            border-radius: 2px;
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .toc-item {
            font-size: 0.8rem;
            line-height: 1.3;
        }
        .toc-item a {
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s;
            display: block;
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
        }
        .toc-item a:hover { color: var(--accent); background: var(--surface); }
        .toc-item.level-3 { margin-left: 0.8rem; border-left: 1px solid var(--border); }

        .container {
            max-width: 860px;
            margin: 0 auto 0 260px;
            padding: 3rem 4rem;
            animation: fadeIn 0.6s ease-out;
        }

        @media (max-width: 1024px) {
            .sidebar { width: 220px; padding: 1rem; }
            .container { margin-left: 220px; padding: 2rem; }
        }

        @media (max-width: 800px) {
            .sidebar { position: static; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .container { margin-left: 0; padding: 1.5rem; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        .meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .meta::before {
            content: '';
            width: 20px;
            height: 1px;
            background-color: var(--accent);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.2;

        .markdown-body h3 {

        footer {

    <script id="markdown-raw" type="text/markdown">## 附录

### 附录 A · 标签字典完整列表 (部分摘录)

v1.1 包含约 80 个标签,核心分类如下:

| 类别 | 核心标签示例 | 说明 |
|---|---|---|
| **价格行为** | `zt`, `dt`, `first_board`, `breakout_60d` | 基础行情状态 |
| **资金流向** | `main_inflow_strong`, `lhb_inst_buy`, `capital_rank_jump` | 核心资金面异动 |
| **板块地位** | `sector_leader`, `mainline_resonance` | 个股与板块的联动 |
| **形态特征** | `pre_zt_consolidation`, `zt_one_word`, `breakout_box_60d` | 技术形态识别 |
| **异常状态** | `st`, `new_stock`, `micro_cap` | 用于排除或特殊标注 |
| **外部共振** | `sox_up_overnight`, `us_tech_strong` | 跨市场印证信号 |

> **注**: 完整 80 条 INSERT 语句见 `scripts/anomaly/init_tag_dict.sql` (待生成)。

---

### 附录 B · 预设 Profile 配置

系统预设 5 套筛选模板,满足不同研究场景:

1.  **profile_default (新手默认)**: 标准过滤,排除 ST/次新/极低成交。
2.  **profile_short_term (短线接力派)**: 侧重连板梯队、板块龙头及高共振信号。
3.  **profile_value_observer (中线机构派)**: 侧重机构席位买入、业绩超预期及年线突破。
4.  **profile_sector_research (板块研究派)**: 强力加权板块共振标签,忽略孤立异动。
5.  **profile_research_mode (全量研究模式)**: 不进行任何过滤,展示全量三池数据。

---

### 附录 C · 信号生命周期 (阶段 2 预留)

**本期仅建表 (`log_signal_lifecycle`),不实现自动填充逻辑。**

#### 设计意图
不仅记录"今天触发了什么",更要追踪"3 日前、5 日前触发的信号现在的演化状态"(如:持续走强、转弱中断、趋势反转)。这是构建长期认知训练系统的核心数据基础。

```sql
CREATE TABLE `log_signal_lifecycle` (
  `id`               BIGINT UNSIGNED  AUTO_INCREMENT PRIMARY KEY,
  `original_id`      BIGINT UNSIGNED  NOT NULL COMMENT '关联统一信号表 id',
  `tracked_date`     DATE             NOT NULL,
  `state`            VARCHAR(20)      NOT NULL COMMENT 'active/continuing/reversed/failed',
  `delta_metrics`    JSON             COMMENT '相对触发日的变化指标'
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
```

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
