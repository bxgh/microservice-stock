## 1. 简介

本模块在 L8 现有基础上扩展,产出**统一异动池** + **每日 Top 10 推送清单**,作为后续"观察点系统"的信号供给层。

### 1.1 v1.1 核心变化
- **弹性设计**: 标签 + Profile 替代固定优先级。
- **形态标签**: 扩展至 22 个细分标签,大幅强化形态识别。
- **多维印证**: 引入共振等级 (L1-L5)、反向信号、时间共振。
- **数据保留**: 被忽略的涨停也入库,带 `excluded_reasons` 标注。

### 1.2 目标与范围
- 产出 3 类异动池 (strong / early / trap)。
- 每条信号附带完整多维标签及多维印证评估。
- 综合评分函数支持权重热配置及重复跟踪压制。

---

---

## 3. 核心共识 (基线)

- **定位**: 信号优选 → 多维标注 → Top 10 输出。
- **三池**: `strong` (强异动)、`early` (启动前)、`trap` (陷阱)。
- **启动前优先组合**: 龙头预备役 > 连板接力 > 箱体蓄势 > 趋势反转。
- **弹性原则**: 系统不替用户预设涨停优先级,通过 Profile 实现。

---

## 4. 实施路线

- **技术依赖**: 依赖 L1-L8 已有数据。
- **里程碑**: 预计工时 9 天,从 DDL 落地到调度集成。
- **风险点**: MySQL 5.7 排名计算性能、形态判定复杂度、权重调优。

        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
