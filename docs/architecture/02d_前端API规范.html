## 1. 基础与股票数据接口 (Base & Stock Data)

### 1.1 交易日历 (Trading Calendar)

#### `GET /api/v1/baostock/calendar/tradingDays`
**用途**: 获取指定周的实际交易日列表（用于渲染 5 节点墙）。

**Query Parameters**:
| 参数 | 类型 | 说明 |
|:---|:---|:---|
| `week` | string | `current`（默认）或 `YYYY-Www`（如 `2026-W01`） |

**Response**:
```json
{
  "weekLabel": "2026-W01",
  "tradingDays": [
    { "date": "2025-12-30", "dayOfWeek": 1, "isHoliday": false },
    { "date": "2025-12-31", "dayOfWeek": 2, "isHoliday": false },
    { "date": "2026-01-02", "dayOfWeek": 4, "isHoliday": false },
    { "date": "2026-01-03", "dayOfWeek": 5, "isHoliday": false }
  ],
  "holidays": [
    { "date": "2026-01-01", "name": "元旦" }
  ]
}
```

### 1.3 股票搜索与列表

#### `GET /api/v1/stocks/search`
**用途**: 股票代码/名称模糊搜索

**Query Parameters**:
```
q: string          # 搜索关键词 (代码或名称)
market: string     # 可选，市场过滤 (sh/sz/all)
limit: int         # 默认 20，最大 100
```

**Response**:
```json
{
  "total": 156,
  "items": [
    {
      "code": "sh.600519",
      "name": "贵州茅台",
      "market": "sh",
      "industry": "白酒",
      "listing_date": "2001-08-27"
    }
  ]
}
```

---

#### `GET /api/v1/stocks/list`
**用途**: 获取全市场股票列表 (支持分页)

### 2.1 周度审计报告 (Weekly Audit Report)

#### `GET /api/v1/baostock/audit/weekly` ❌ 待开发
**用途**: 获取本周每日的三级存储审计数据（预计算结果）。

**Query Parameters**:
| 参数 | 类型 | 说明 |
|:---|:---|:---|
| `week` | string | `current`（默认）或 `YYYY-Www` |

**Response**:
```json
{
  "weekLabel": "2026-W01",
  "lastUpdated": "2026-01-01 18:35:00",
  "days": [
    {
      "date": "2025-12-30",
      "kline": {
        "l1_baseline": 5820,
        "l2_mysql": 5815,
        "l3_clickhouse": 5810,
        "completeness_pct": 99.8
      },
      "adjustFactor": {
        "l1_baseline": 5820,
        "l2_mysql": 12,
        "l3_clickhouse": 12,
        "completeness_pct": 100.0
      },
      "overallStatus": "partial"
    }
  ]
}
```

**`overallStatus` 判定逻辑**:
- `complete`: 所有数据 100%
- `partial`: 任一类型 ≥95% 且 <100%
- `critical`: 任一类型 <95%
- `holiday`: 休市日

## 8. 错误响应规范

所有接口统一使用以下错误格式:

```json
{
  "error": {
    "code": "RESOURCE_NOT_FOUND",
    "message": "股票代码不存在",
    "request_id": "req_abc123",
    "details": {
      "code": "sh.999999"
    }
  }
}
```

**常见错误码**:
- `UNAUTHORIZED`: 401 - 未授权
- `FORBIDDEN`: 403 - 权限不足
- `RESOURCE_NOT_FOUND`: 404 - 资源不存在
- `RATE_LIMIT_EXCEEDED`: 429 - 超过速率限制
- `INTERNAL_ERROR`: 500 - 服务器内部错误

                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
