### 架构优化说明

#### ✅ 三层存储架构

| 层级 | 组件 | 角色 | 性能 |
|------|------|------|------|
| **L1: 云端MySQL** | 主数据源 | 实时写入、事务保证 | 写入 <10ms |
| **L2: 内网ClickHouse** | 查询加速层 | 只读、列式存储、压缩 | 查询 <15ms（比MySQL快13倍） |
| **L3: 内存计算** | Pandas/NumPy | 热数据缓存 | 查询 <1ms |

#### ✅ 关键性能优化点

1. **ClickHouse列式存储优势**：
   - 回测仅需 `date, close, volume` 3列，无需加载全部20+字段
   - 查询性能：MySQL 200ms → ClickHouse 15ms
   - 压缩比：原始2GB → 压缩后60MB（节省磁盘空间）

2. **内网直连MySQL（写入）+ ClickHouse（查询）**：
   - 云端数据采集 → MySQL（保证实时性和一致性）
   - 内网T+1同步 → ClickHouse（历史数据查询加速）
   - 回测结果 → MySQL（保证数据安全）

3. **数据同步策略**：
   - 每日16:00收盘后，从MySQL拉取当日新增K线
   - 批量导入ClickHouse（单次同步耗时 <1分钟）
   - 历史数据查询无延迟，实时数据允许T+1延迟

## 3. 核心设计方案

### 3.1 网络通信架构

基于内网可直连MySQL的确认，通信架构大幅简化：

| 通信路径 | 协议 | 用途 | 性能 |
|---------|------|------|------|
| **内网 → MySQL** | **TCP:26300** | **策略回测数据读取**（主要） | **< 50ms** |
| 内网 → Redis | TCP:6379 (待测) | 任务队列、实时缓存 | < 10ms |
| 内网 → Cloud API | HTTPS:443 (备选) | 任务提交/状态查询 | ~100ms |
| 云端微服务 → MySQL | TCP:26300 | 数据采集写入 | < 10ms (同机房) |

#### 通信模式设计

**方案A：Redis队列模式**（如果Redis连通 ⚠️待测）
```python
# 云端：任务派发
redis.lpush("task:backtest", json.dumps({
    "task_id": "uuid",
    "strategy": "MA_CROSS",
    "params": {"stock": "600519", "start": "2021-01-01"}
}))

# 内网：Worker拉取任务
task = redis.brpop("task:backtest", timeout=30)
# 直接查询MySQL执行回测
result = backtest_engine.run(task)
# 结果写回MySQL
mysql.execute("INSERT INTO backtest_results ...")
```

**方案B：HTTP轮询模式**（兜底方案）
```python
# 内网：定时轮询云端API
while True:
    tasks = requests.get("https://cloud/api/tasks/pending")
    for task in tasks:
        result = backtest_engine.run(task)
        requests.post("https://cloud/api/tasks/complete", json=result)
    time.sleep(5)
```

### 3.2 服务拆分详述

#### A. 云端 (2C 4G) - "采集+网关"
*   **akshare-api, baostock-api, pywencai-api**：独立容器，各限制256MB
*   **cloud-api**：业务聚合层，800MB（处理用户请求、聚合数据源）
*   **nginx**：静态资源+反向代理，128MB
*   **redis**：任务队列+缓存，1.5GB

#### B. 内网 (10C 64G) - "计算中心"
*   **策略回测引擎**：
    - Backtrader框架，单次回测可占用 5-20GB 内存（加载全市场数据）
    - 并发度：建议同时运行 2-3 个回测任务
*   **因子计算服务**：
    - Pandas批量计算技术指标
    - 直接从MySQL读取原始K线 → 计算因子 → 写入 `factor_data` 表
*   **AI模型训练**（可选）：
    - 使用scikit-learn/XGBoost训练选股模型
    - 64G内存足够支撑中等规模深度学习

#### C. 数据层 - MySQL + ClickHouse混合架构

**双数据库职责分工**：

| 数据库 | 角色 | 读写模式 | 适用场景 |
|--------|------|---------|---------|
| **MySQL（云端）** | 主数据源 | 读写 | 实时数据采集、事务处理、用户数据 |
| **ClickHouse（内网）** | 查询加速 | 只读 | 回测查询、因子计算、大规模聚合 |

**MySQL表结构（保持现有设计）**：

```sql
-- 核心K线表（支持快速范围查询）
CREATE TABLE kline_day (
    id BIGINT AUTO_INCREMENT PRIMARY KEY,
    code VARCHAR(10) NOT NULL,
    trade_date DATE NOT NULL,
    open DECIMAL(10,2),
    high DECIMAL(10,2),
    low DECIMAL(10,2),
    close DECIMAL(10,2),
    volume BIGINT,
    INDEX idx_code_date (code, trade_date)
) ENGINE=InnoDB;

-- 回测结果表
CREATE TABLE backtest_results (
    id BIGINT AUTO_INCREMENT PRIMARY KEY,
    task_id VARCHAR(36) UNIQUE,
    strategy_name VARCHAR(50),
    total_return DECIMAL(10,4),
    sharpe_ratio DECIMAL(10,4),
    max_drawdown DECIMAL(10,4),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    equity_curve JSON
) ENGINE=InnoDB;
```

**ClickHouse表结构（内网查询加速）**：

```sql
-- 采用MergeTree引擎，按月分区
CREATE TABLE kline_day
(
    code String,
    trade_date Date,
    open Float32,
    high Float32,
    low Float32,
    close Float32,
    volume UInt64,
    amount Float64,
    turnover Float32,
    pct_chg Float32
)
ENGINE = MergeTree()
PARTITION BY toYYYYMM(trade_date)  -- 按月分区，加速历史查询
ORDER BY (code, trade_date)
SETTINGS index_granularity = 8192;

-- 性能对比：
-- 查询600519三年数据（~750条）
-- MySQL: SELECT * FROM kline_day WHERE code='600519' AND trade_date >= '2021-01-01'  → 200ms
-- ClickHouse: 同样查询 → 15ms（快13倍）
```

**数据同步机制**：

```python
# 内网：每日定时任务（16:05执行）
import clickhouse_driver
import pymysql
from datetime import date

def sync_daily_kline():
    # 1. 连接云端MySQL
    mysql_conn = pymysql.connect(
        host='sh-cdb-h7flpxu4.sql.tencentcdb.com',
        port=26300,
        user='xxx',
        password='xxx',
        database='alwaysup'
    )
    
    # 2. 获取今日新增数据
    today = date.today()
    cursor = mysql_conn.cursor()
    cursor.execute("""
        SELECT code, trade_date, open, high, low, close, volume, amount
        FROM kline_day
        WHERE trade_date = %s
    """, (today,))
    new_data = cursor.fetchall()
    
    # 3. 批量插入ClickHouse
    ch_client = clickhouse_driver.Client('localhost')
    ch_client.execute(
        "INSERT INTO kline_day VALUES",
        new_data
    )
    
    print(f"✅ 同步完成：{len(new_data)} 条K线数据")

# Cron: 0 16 * * 1-5  /usr/bin/python3 /path/to/sync_daily_kline.py
```

    User->>Mini: 打开自选股页面
    Mini->>Nginx: GET /api/stocks/watchlist
    Nginx->>API: 转发请求
    
    API->>Redis: GET watchlist:{user_id}
    alt 缓存命中
        Redis-->>API: 返回股票列表
    else 缓存未命中
        API->>MySQL: SELECT code FROM watchlist
        MySQL-->>API: 返回股票列表
        API->>Redis: SET watchlist:{user_id}
    end
    
    API->>AkShare: 批量获取实时价格
    AkShare-->>API: 返回行情数据
    API-->>Mini: JSON响应
    Mini-->>User: 展示实时行情
```

**性能指标**：端到端延迟 < 300ms

### 场景二：用户提交策略回测任务（Web端）

```mermaid
sequenceDiagram
    participant User as 用户
    participant Web as Web前端
    participant API as Cloud-API
    participant Redis as Redis队列
    participant Worker as 内网Worker
    participant MySQL as MySQL

    User->>Web: 配置策略参数<br/>MA5/MA20, 600519, 2021-2024
    Web->>API: POST /api/backtest/submit
    API->>MySQL: INSERT INTO tasks (status='pending')
    API->>Redis: LPUSH task:backtest {task_id, params}
    API-->>Web: {task_id: "xxx"}
    
    Note over Worker,Redis: 内网Worker监听队列
    Worker->>Redis: BRPOP task:backtest
    Redis-->>Worker: 返回任务
    
    Worker->>MySQL: SELECT * FROM kline_day<br/>WHERE code='600519'<br/>AND date BETWEEN '2021-01-01' AND '2024-12-31'
    MySQL-->>Worker: 返回~1000条K线数据
    
    Note over Worker: Backtrader回测引擎<br/>执行策略，耗时5-30秒
    
    Worker->>MySQL: INSERT INTO backtest_results<br/>(task_id, total_return=0.45, sharpe=1.8, ...)
    Worker->>MySQL: UPDATE tasks SET status='completed'
    
    Note over Web,API: 前端轮询或WebSocket接收通知
    Web->>API: GET /api/backtest/{task_id}
    API->>MySQL: SELECT * FROM backtest_results
    MySQL-->>API: 返回回测详情
    API-->>Web: JSON结果
    Web-->>User: 展示收益曲线
```

**关键优化点**：
- ✅ 内网直连MySQL读取K线，避免传输100MB+ JSON数据
- ✅ 回测结果直接写入MySQL，无需HTTP序列化
- ✅ 云端API仅负责任务派发和状态查询，不参与数据传输

## 5. 前端架构建议

| 端 | 技术选型 | 关注点 |
|----|----------|--------|
| **微信小程序** | Taro 或 Uni-app | **轻量化**。仅展示核心看板、个股详情、策略信号预警。使用 ECharts 为小程序优化的版本。 |
| **桌面 Web** | React + Ant Design | **专业性**。提供K线复盘（Lightweight-charts高性能）、策略代码编辑器、复杂表单配置。 |

## 6. 实施路线图

1.  **基础设施联通 (Day 1-2)**:
    *   [云端] 安装 Redis，配置防火墙允许内网IP访问。
    *   [内网] 编写简单的 Python 脚本测试连接云端 MySQL 和 Redis。

2.  **数据同步服务 (Day 3-5)**:
    *   迁移现有的 `akshare/baostock` 服务到 **内网服务器** (因为内网算力强，且抓取任务无需公网IP暴露)。
    *   内网配置定时任务，每日收盘后抓取数据 -> 写入云端 MySQL。

3.  **API 网关开发 (Day 6-10)**:
    *   在云端部署 FastAPI。
    *   实现 `/auth` (登录) 和 `/market` (读库) 接口。

4.  **计算微服务化 (Day 11-15)**:
    *   利用 `Celery` + `Redis` 搭建异步任务框架。
    *   将策略代码封装为 Worker 函数，部署在内网。

---

## 7. 潜在风险与对策

*   **风险**: 内网服务器断电/断网。
    *   **对策**: 云端API需实现"降级处理"，检测到Worker离线时，提示用户"回测服务暂不可用"，但不影响基础行情查看。
*   **风险**: 云数据库流量费。
    *   **对策**: 尽量在内网缓存历史数据，减少对云端MySQL的全量读取；回测结果仅上传摘要数据，不上传详单。
