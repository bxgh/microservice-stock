    <script id="markdown-raw" type="text/markdown"># 股票数据源微服务架构设计

## 1. 架构概述

本系统采用微服务架构，将不同的股票数据源封装为独立的Docker容器服务，通过API网关统一对外提供服务。

### 1.1 核心设计原则

- **服务独立性**: 每个数据源独立部署，互不影响
- **容器化**: 所有服务使用Docker容器化，便于部署和扩展
- **统一接口**: 通过API网关提供统一的RESTful API
- **高可用**: 支持服务的水平扩展和故障隔离
- **可观测性**: 集成日志、监控和链路追踪

## 3. 微服务详细设计

### 3.1 akshare-api (:8000)

**数据源**: 东方财富等多个数据源

**核心功能**:
- 财务报表数据
- 估值指标(PE/PB/PS)
- 历史估值数据
- 龙虎榜数据
- 个股行业分类
- 热门排行榜

**API端点**:

| 端点 | 方法 | 功能 | 参数 |
|------|------|------|------|
| `/api/v1/finance/{code}` | GET | 财务报表 | code=600519 |
| `/api/v1/valuation/{code}` | GET | 估值指标 | code=600519 |
| `/api/v1/valuation/{code}/history` | GET | 历史估值 | start_date, end_date |
| `/api/v1/dragon_tiger/daily` | GET | 龙虎榜 | date=2024-01-15 |
| `/api/v1/industry/stock/{code}` | GET | 个股行业 | code=600519 |
| `/api/v1/rank/hot` | GET | 热门排行 | limit=50 |

**技术栈**:
- Python 3.12
- FastAPI框架
- akshare库
- Alpine基础镜像

**资源限制**: 内存≤128MB

**响应示例**:
```json
{
  "code": "600519",
  "total_revenue": 150000000000,
  "net_profit": 75000000000,
  "roe": 0.32,
  "report_date": "2024-09-30"
}
```

---

### 3.2 baostock-api (:8001)

**数据源**: baostock.com:10030 (TCP连接)

**核心功能**:
- 历史K线数据(前复权/后复权)
- 指数成分股
- 行业分类
- 盈利能力指标

**API端点**:

| 端点 | 方法 | 功能 | 参数 |
|------|------|------|------|
| `/api/v1/history/kline/{code}` | GET | 历史K线 | frequency=d, adjust=2 |
| `/api/v1/index/cons/{index}` | GET | 指数成分 | index=sz.399300 |
| `/api/v1/industry/classify` | GET | 行业分类 | - |
| `/api/v1/finance/profit/{code}` | GET | 盈利能力 | code=sh.600519 |
| `/api/v1/sync/kline/{code}` | POST | 同步个股至MySQL | start_date, end_date |
| `/api/v1/sync/full` | POST | 一键全市场同步 | start_date |
| `/api/v1/sync/status` | GET | 查看同步进度 | - |
| `/api/v1/sync/reset` | POST | 重置同步进度 | - |

**数据持久化策略**:
- **存储**: 腾讯云 MySQL 5.7
- **机制**: 异步 `BackgroundTasks` + `aiomysql` 连接池
- **特性**: 
  - **断点续传**: 使用 `sync_progress` 表记录处理索引，支持崩溃后自动恢复
  - **增量同步**: 自动识别库内最新日期，仅抓取缺失数据

**关键参数**:
- `adjust`: 1=后复权, 2=前复权, 3=不复权
- `frequency`: d=日线, w=周线, m=月线, 5=5分钟

**技术栈**:
- Python 3.12
- FastAPI框架
- baostock库
- Alpine基础镜像

**资源限制**: 内存≤128MB

**响应示例**:
```json
[{
  "date": "2024-01-15",
  "open": 1680.00,
  "high": 1699.50,
  "low": 1675.00,
  "close": 1695.00,
  "volume": 1234567,
  "amount": 2098765432,
  "turn": 0.12,
  "pctChg": 1.25
}]
```

### 3.3 pywencai-api (:8002)

**数据源**: 同花顺问财

**核心功能**:
- 自然语言选股
- 热门板块数据

**API端点**:

| 端点 | 方法 | 功能 | 参数 |
|------|------|------|------|
| `/api/v1/query` | POST | 自然语言查询 | q="今日涨停" |
| `/api/v1/sector/hot` | GET | 热门板块 | - |

**技术栈**:
- Python 3.12
- FastAPI框架
- pywencai库
- Alpine基础镜像

**资源限制**: 内存≤128MB

**特殊注意**:
- ⚠️ 反爬限制严格,需处理验证码
- ⚠️ 预期失败率约30%
- ⚠️ 频率限制约10次/分钟

**请求示例**:
```json
{
  "q": "连续3日涨停",
  "perpage": 100
}
```

**响应示例**:
```json
{
  "columns": ["股票代码", "股票名称", "涨停天数", "最新价"],
  "data": [
    ["000001", "平安银行", 3, 12.50],
    ["600519", "贵州茅台", 3, 1700.00]
  ]
}
```

## 4. 统一技术规范

### 4.1 框架要求

| 项目 | 要求 |
|------|------|
| Web框架 | FastAPI (必须) |
| 响应格式 | JSON |
| 健康检查 | `GET /health` → `{"status": "healthy"}` |
| 错误码 | 4xx 客户端错误, 5xx 服务端错误 |
| 超时时间 | 30秒 |
| 日志格式 | JSON格式,必须包含request_id |

### 4.2 错误响应格式

```json
{
  "error": {
    "code": "VALIDATION_ERROR",
    "message": "Invalid stock code format",
    "request_id": "req-20241220-001"
  }
}
```

### 4.3 日志规范

每个请求必须记录:
```json
{
  "timestamp": "2025-12-20T18:47:05+08:00",
  "request_id": "req-20241220-001",
  "method": "GET",
  "path": "/api/v1/finance/600519",
  "status": 200,
  "duration_ms": 245,
  "client_ip": "192.168.151.18"
}
```

### 6.2 通用Dockerfile模板

```dockerfile
FROM python:3.12-alpine

# 安装必要的系统依赖
RUN apk add --no-cache \
    curl \
    gcc \
    musl-dev \
    libffi-dev

WORKDIR /app

# 复制依赖文件
COPY requirements.txt .

# 安装Python依赖
RUN pip install --no-cache-dir -r requirements.txt

# 复制应用代码
COPY app/ ./app/

# 暴露端口
EXPOSE 8000

# 启动命令
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
```

## 7. 数据调用流程

### 7.1 本地到云端调用链路

```mermaid
sequenceDiagram
    participant Local as mootdx-source<br/>(本地)

## 9. 腾讯云网络配置 (关键)

> ⚠️ **重要**: 腾讯云服务器需要同时配置**安全组**和**系统防火墙**才能访问端口

### 9.1 安全组配置

在腾讯云控制台配置入站规则:

| 协议 | 端口 | 来源 | 说明 |
|------|------|------|------|
| TCP | 8000 | 0.0.0.0/0 | akshare-api |
| TCP | 8001 | 0.0.0.0/0 | baostock-api |
| TCP | 8002 | 0.0.0.0/0 | pywencai-api |
| TCP | 22 | 指定IP | SSH管理 |

**配置步骤**:
1. 登录腾讯云控制台 → 云服务器 → 安全组
2. 选择服务器绑定的安全组 → 入站规则
3. 添加上述规则 → 保存

### 9.2 系统防火墙配置

```bash
# Ubuntu/Debian - 检查ufw状态
sudo ufw status

# 如果启用,开放端口
sudo ufw allow 8000/tcp
sudo ufw allow 8001/tcp
sudo ufw allow 8002/tcp

# CentOS - 使用firewalld
sudo firewall-cmd --permanent --add-port=8000/tcp
sudo firewall-cmd --permanent --add-port=8001/tcp
sudo firewall-cmd --permanent --add-port=8002/tcp
sudo firewall-cmd --reload
```

### 9.3 Docker镜像加速

腾讯云服务器访问Docker Hub较慢,配置加速:

```bash
# 创建配置文件
sudo mkdir -p /etc/docker
sudo tee /etc/docker/daemon.json <<EOF
{
  "registry-mirrors": [
    "https://mirror.ccs.tencentyun.com"
  ]
}
EOF

# 重启Docker
sudo systemctl daemon-reload
sudo systemctl restart docker
```

### 9.4 出站网络要求

服务需要访问外部数据源,确保出站规则允许:

| 目标 | 端口 | 用途 |
|------|------|------|
| baostock.com | 10030 (TCP) | BaoStock数据 |
| *.eastmoney.com | 443 (HTTPS) | 东方财富(AkShare) |
| *.10jqka.com.cn | 443 (HTTPS) | 同花顺问财 |

> 腾讯云默认出站全放通,一般无需配置
