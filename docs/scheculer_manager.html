## 1. 项目概述

### 1.1 定位
这是一款面向个人量化交易者的**数据质量监控与任务管理**小程序。用户可以通过手机随时查看股票数据采集状态、触发补采任务、接收告警通知。

### 1.2 技术栈
- **框架**: 原生微信小程序 或 uni-app
- **UI 库**: WeUI / Vant Weapp
- **请求**: wx.request (封装统一的 API 调用模块)
- **状态管理**: 简单场景可用 globalData，复杂可用 MobX

### 1.3 后端接口
- **基础 URL**: `https://your-domain.com/api/v1`
- **认证方式**: 暂无 (后续可加 Token)

---

## 2. 页面结构

```
pages/
├── index/index          # 首页：今日数据概览 + 快捷操作
├── tasks/list           # 任务列表：查看所有任务状态
├── tasks/detail         # 任务详情：查看执行历史
├── commands/history     # 命令历史：我发起的触发记录
└── settings/index       # 设置：告警开关、阈值配置
```

---

## 4. API 接口规范

### 4.1 获取今日数据概览
```yaml
GET /api/v1/dashboard/overview

Response:
{
  "date": "2026-01-14",
  "kline_coverage": 98.5,
  "tick_coverage": 92.3,
  "kline_status": "ok",      // ok | warning | error
  "tick_status": "warning",
  "recent_tasks": [
    {
      "task_id": "daily_kline_sync",
      "name": "K线同步",
      "status": "SUCCESS",
      "last_run": "2026-01-14T17:32:00"
    }
  ]
}
```

### 4.2 获取任务列表
```yaml
GET /api/v1/tasks

Response:
{
  "tasks": [
    {
      "id": "pre_market_gate",
      "name": "盘前数据校验",
      "category": "pre_market",
      "enabled": true,
      "schedule": "08:00 交易日",
      "next_run": "2026-01-15T08:00:00",
      "last_status": "SUCCESS"
    }
  ]
}
```

### 4.3 触发任务命令
```yaml
POST /api/v1/commands

Request:
{
  "task_id": "sync_tick",
  "params": {
    "target_date": "20260113"   // 可选
  }
}

Response:
{
  "command_id": 15,
  "status": "PENDING",
  "message": "命令已加入队列"
}
```

### 4.4 查询命令状态
```yaml
GET /api/v1/commands/{command_id}

Response:
{
  "id": 15,
  "task_id": "sync_tick",
  "status": "DONE",           // PENDING | RUNNING | DONE | FAILED
  "created_at": "2026-01-14T09:15:00",
  "executed_at": "2026-01-14T09:15:05",
  "result": "SUCCESS"
}
```

### 4.5 获取命令历史
```yaml
GET /api/v1/commands?limit=20

Response:
{
  "commands": [
    {
      "id": 15,
      "task_id": "sync_tick",
      "status": "DONE",
      "created_at": "2026-01-14T09:15:00"
    }
  ]
}
```

## 5. 开发注意事项

### 5.1 网络请求封装
```javascript
// utils/api.js
const BASE_URL = 'https://your-domain.com/api/v1';

export const request = (options) => {
  return new Promise((resolve, reject) => {
    wx.request({
      url: BASE_URL + options.url,
      method: options.method || 'GET',
      data: options.data,
      success: (res) => {
        if (res.statusCode === 200) {
          resolve(res.data);
        } else {
          reject(res);
        }
      },
      fail: reject
    });
  });
};

// 使用示例
import { request } from '../../utils/api';
const overview = await request({ url: '/dashboard/overview' });
```

### 5.2 状态颜色规范
| 状态 | 颜色 | 图标 |
|:-----|:-----|:-----|
| SUCCESS / ok | #52c41a (绿) | ✅ |
| WARNING | #faad14 (黄) | ⚠️ |
| FAILED / error | #f5222d (红) | ❌ |
| RUNNING | #1890ff (蓝) | ⏳ |
| PENDING | #8c8c8c (灰) | ⏰ |

### 5.3 域名配置
在微信公众平台后台配置：
- **request 合法域名**: `https://your-domain.com`

## 6. 开发顺序建议

1. **首页 (index)**: 仅展示静态 Mock 数据
2. **手动触发弹窗**: 实现 POST /commands 调用
3. **命令历史页**: 实现列表拉取与状态轮询
4. **任务列表页**: 展示所有任务配置
5. **联调对接**: 替换 Mock 为真实 API
