    <script id="markdown-raw" type="text/markdown"># 五维度数据深度补充计划

## 1. 现状评估与目标

目前系统已建立全量 Market 维度数据及基本的其他维度数据框架。但 Chip, Game, Information 维度的历史数据严重缺失，无法支持回测分析。

**目标**: 将所有核心维度的数据回溯补充至 **至少3年 (2023-01-01 起)**，关键高频数据（如龙虎榜、北向）补充至 **5年 (2021-01-01 起)**。

## 2. 补充策略

### 2.1 龙虎榜 (LHB) - 优先级: 高
*   **现状**: 40+ 条 (仅单日)
*   **目标**: 补充 2021-01-01 至今的数据。
*   **数据量**: 约 250(天) * 5(年) * 50(榜单) ≈ 62,500 条。
*   **API**: AkShare `stock_lhb_detail_em` (按日期范围)。
*   **执行**: 
    1. 开发批量脚本 `scripts/init_lhb_history.py`。
    2. 按月分片请求，避免超时。
    3. 入库 `stock_lhb_daily`。

### 2.2 北向资金 (North Funds) - 优先级: 中
*   **现状**: 1,124 条 (极少)
*   **目标**: 补充 2021-01-01 至今的**每日个股持仓**。
*   **难点**: AkShare `stock_hsgt_hold_stock_em` 每个交易日数据量大 (2000+ 只股票)。
*   **策略**: 
    1. 仅对**成分股**（如沪深300、中证500）进行全量回溯。
    2. 或按日循环拉取全市场数据（耗时较长，需后台运行）。
    3. 入库 `stock_north_funds_daily`。

### 2.3 融资融券 (Margin) - 优先级: 中
*   **现状**: 每日更新正常，历史缺失。
*   **目标**: 补充 2023-01-01 至今。
*   **策略**: AkShare `stock_margin_detail_sse` / `szse`。按股票循环拉取（API通常提供单只股票的历史列表），适合多线程并行。

### 2.4 分析师评级 (Analyst Rank) - 优先级: 低
*   **现状**: 200+ 条
*   **目标**: 2023-01-01 至今。
*   **API**: AkShare `stock_research_report_em`
*   **策略**: 该接口返回数据量较大，一次性拉取需注意内存。可按日期或分页拉取。

### 2.5 市场情绪 (Sentiment) - 优先级: 低
*   **现状**: 1 条
*   **说明**: 情绪数据具有瞬时性，历史回溯意义有限（很难获取当年的实时热度）。
*   **决策**: **放弃历史回溯**，专注于从今日起的高质量积累。

## 3. 执行计划 (Timeline)

### 阶段一：龙虎榜与事件 (Day 1-2)
- [ ] 编写 `scripts/backfill/backfill_lhb.py`：回溯龙虎榜。
- [ ] 编写 `scripts/backfill/backfill_forecast.py`：回溯业绩预告 (已部分完成，需补全历史)。
- [ ] 编写 `scripts/backfill/backfill_release.py`：回溯解禁数据。

### 阶段二：资金流向 (Day 3-5)
- [ ] 编写 `scripts/backfill/backfill_north.py`：回溯北向资金（高耗时）。
- [ ] 编写 `scripts/backfill/backfill_margin.py`：回溯融资融券差异。

### 阶段三：自动化与校验 (Day 6)
- [ ] 编写数据完整性校验脚本 `scripts/audit_data_depth.py`。
- [ ] 在 `docs/` 更新数据覆盖时间范围。

## 4. 脚本规范
所有回溯脚本必须：
1. **幂等**: 可重复运行，使用 `INSERT IGNORE` 或 `ON DUPLICATE KEY UPDATE`。
2. **限流**: 调用 AkShare 接口时增加 `time.sleep`，避免被封禁。
3. **日志**: 输出详细进度到日志文件。
4. **断点续传**: 记录已完成的日期/股票代码，失败后可接续运行。

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
