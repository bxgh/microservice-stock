    <script id="markdown-raw" type="text/markdown">基于我们确定的“五维度量化分析体系”，为了确保你的本地开发能够顺利进行，我为你整理了一份**严格基于免费、公开、可程序化获取**的数据源清单。

这份清单的核心工具是 **AkShare**（一个基于 Python 的开源财经数据接口库），它封装了东方财富、新浪财经、交易所官网等公开接口。

---

### 1. 权利维度 (Power) —— 政策锚定与顶层意志

此维度数据多为非结构化文本，需通过关键词提取量化。

| 核心数据指标 | 原始数据来源 | Python 接口 (推荐 AkShare) | 频率 | 用途 |
| --- | --- | --- | --- | --- |
| **个股新闻/公告** | 东方财富/巨潮资讯 | `ak.stock_news_em(symbol="代码")` | 实时 | 抓取“中标”、“合同”、“国资”等关键词。 |
| **行业政策** | 财联社/新浪财经 | `ak.stock_news_em(symbol="行业板块")` | 实时 | 识别行业层面的政策红利（如“算力补贴”）。 |
| **董监高持股变动** | 交易所官网 | `ak.stock_em_gjd()` (国家队持仓)<br>

<br>`ak.stock_zh_a_gdhs()` | 日/季 | 识别是否有“国家队”进场或高管增持。 |

---

### 2. 筹码维度 (Chips) —— 持仓结构与成本分布

此维度重点在于穿透报告期，寻找“隐藏的换手”。

| 核心数据指标 | 原始数据来源 | Python 接口 (推荐 AkShare) | 频率 | 用途 |
| --- | --- | --- | --- | --- |
| **股东户数** | 交易所互动易 | `ak.stock_zh_a_gdhs(symbol="代码")` | 不定期 | 捕捉非财报期的筹码集中度变化（核心负熵指标）。 |
| **十大股东** | 定期报告 | `ak.stock_zh_a_gdhs_detail_em()` | 季度 | 分析是否有机构/产业资本锁仓。 |
| **限售股解禁** | 交易所/财经网 | `ak.stock_restricted_release_queue_em()` | T+N | **风控核心**：提前 30 天预警大额解禁抛压。 |
| **大宗交易** | 交易所数据 | `ak.stock_dzjy_mrtj(start_date="...")` | 每日 | 识别机构是否在盘后通过大宗交易“倒手”或“出货”。 |

---

### 3. 能量维度 (Energy) —— 动能与趋势

这是最基础的行情数据，确保数据的复权处理准确。

| 核心数据指标 | 原始数据来源 | Python 接口 (推荐 AkShare) | 频率 | 用途 |
| --- | --- | --- | --- | --- |
| **日线行情(OHLCV)** | 新浪/东财 | `ak.stock_zh_a_hist(symbol="代码", adjust="qfq")` | 每日 | **必须前复权**，计算均线、量比、价格动量。 |
| **实时分时数据** | 东财/新浪 | `ak.stock_zh_a_spot_em()` | 实时(3秒) | 盘中监控“量比”异动，捕捉能量爆发点。 |
| **板块资金流** | 东财板块数据 | `ak.stock_sector_fund_flow_rank()` | 实时 | 确认个股上涨是否属于“板块共振”（更安全）。 |

---

### 4. 信息维度 (Information) —— 预期差与热度

此维度需要对文本数据进行简单的 NLP（如情感打分）或统计。

| 核心数据指标 | 原始数据来源 | Python 接口 (推荐 AkShare) | 频率 | 用途 |
| --- | --- | --- | --- | --- |
| **股吧/社区热度** | 东方财富股吧 | `ak.stock_comment_em(symbol="代码")` | 实时 | 统计发帖量斜率。**热度过高=高危卖点**。 |
| **机构研报评级** | 东方财富 Choice | `ak.stock_em_analyst_rank()` | 每日 | 统计“买入”评级家数的变化（一致预期修正）。 |
| **业绩预告** | 交易所公告 | `ak.stock_em_yjyg(date="...")` | 季度 | 提前规避业绩暴雷，或捕捉超预期（信息负熵）。 |

---

### 5. 博弈维度 (Game) —— 对手盘与资金流向

这是免费数据中最难获取的部分，我们用“影子指标”替代昂贵的 L2。

| 核心数据指标 | 原始数据来源 | Python 接口 (推荐 AkShare) | 频率 | 用途 |
| --- | --- | --- | --- | --- |
| **龙虎榜(LHB)** | 交易所官网 | `ak.stock_lhb_detail_em(start_date="...")` | 每日 | **最强博弈指标**。识别是“游资接力”还是“机构扫货”。 |
| **融资融券** | 证金公司 | `ak.stock_margin_detail_sse(date="...")` (沪)<br>

<br>`ak.stock_margin_detail_szse` (深) | T+1 | 计算“融资情绪差”。**散户杠杆激增=危险信号**。 |
| **北向资金** | 港交所/东财 | `ak.stock_hsgt_hist_em(symbol="代码")` | 每日 | 跟踪“聪明钱”（外资）的持续流向。 |
| **主力净流入** | 财经网站测算 | `ak.stock_individual_fund_flow(stock="代码")` | 每日 | 虽然是估算值，但可作为 L2 的免费替代参考。 |

---

### 💡 开发者特别提示：数据清洗规范

在入库这些数据时，为了保证你的“五维算法”不报错，请遵守以下 3 条铁律：

1. **代码统一化 (Ticker Normalization):**
* AkShare 返回的代码可能是 `688802`，也可能是 `sh688802`。
* **规范：** 入库时统一清洗为 `TS_CODE` 格式（如 `688802.SH`），方便跨表 Join。


2. **空值处理 (Null Handling):**
* 融资融券数据在某些标的上可能为空（非两融标的）。
* **规范：** 遇到空值时，博弈维度分值默认设为“中性（50分）”，不要设为 0，否则会拉低雷达图的整体表现。


3. **频率对齐 (Frequency Alignment):**
* 股东人数是不定期的，行情是每日的。
* **规范：** 采用 **“向前填充 (Forward Fill)”** 策略。即：今日没有新的股东人数，就沿用上一次公布的数据进行计算。

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
