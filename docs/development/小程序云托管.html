    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --surface-hover: #1a1a1a;
            --border: #222222;
            --accent: #eab308;
            --accent-glow: rgba(234, 179, 8, 0.1);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --font-sans: 'Outfit', 'Noto Sans SC', -apple-system, sans-serif;
            --font-serif: 'Noto Serif SC', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Subtle background glow */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            right: 0;
            width: 40vw;
            height: 40vh;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            border-right: 1px solid var(--border);
            background: var(--bg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            z-index: 100;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
            padding: 0.5rem;
            border-radius: 6px;
        }
        .nav-link:hover { color: var(--accent); background: var(--surface); }

        .toc-title {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-left: 0.5rem;
        }
        .toc-title::before {
            content: '';
            width: 3px;
            height: 1rem;
            background: var(--accent);
            border-radius: 2px;
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .toc-item {
            font-size: 0.8rem;
            line-height: 1.3;
        }
        .toc-item a {
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s;
            display: block;
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
        }
        .toc-item a:hover { color: var(--accent); background: var(--surface); }
        .toc-item.level-3 { margin-left: 0.8rem; border-left: 1px solid var(--border); }

        .container {
            max-width: 860px;
            margin: 0 auto 0 260px;
            padding: 3rem 4rem;
            animation: fadeIn 0.6s ease-out;
        }

        @media (max-width: 1024px) {
            .sidebar { width: 220px; padding: 1rem; }
            .container { margin-left: 220px; padding: 2rem; }
        }

        @media (max-width: 800px) {
            .sidebar { position: static; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .container { margin-left: 0; padding: 1.5rem; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        .meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .meta::before {
            content: '';
            width: 20px;
            height: 1px;
            background-color: var(--accent);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--text-primary);

        .markdown-body {
            background: transparent !important;
            color: var(--text-primary) !important;
            font-family: var(--font-sans) !important;
            font-size: 0.95rem !important;
        }

        .markdown-body h2 {
            font-family: var(--font-serif);
            font-size: 1.5rem !important;
            color: var(--accent) !important;
            border-bottom: 1px solid var(--border) !important;
            padding-bottom: 0.5rem !important;
            margin-top: 2.5rem !important;
            scroll-margin-top: 1rem;
        }

        .markdown-body h3 {
            font-family: var(--font-serif);
            font-size: 1.25rem !important;
            color: var(--text-primary) !important;
            margin-top: 2rem !important;
            scroll-margin-top: 1rem;
        }

        .markdown-body p, .markdown-body li {
            font-size: 0.95rem !important;
            color: var(--text-primary) !important;
        }
        
        .markdown-body pre {
            background-color: #1a1b26 !important; /* Match Tokyo Night Dark */
            border: 1px solid var(--border);
            border-radius: 8px !important;
            padding: 0 !important; /* Code internal handles padding */
            margin: 1.2rem 0 !important;
            overflow: hidden;
        }

        .markdown-body pre code {
            background-color: transparent !important;
            padding: 1.2rem !important;
            display: block;
            font-family: var(--font-mono) !important;
            font-size: 0.85rem !important;
            line-height: 1.5;
        }

        .markdown-body blockquote {
            border-left: 3px solid var(--accent) !important;
            background: var(--surface);
            padding: 0.8rem 1.2rem;
            color: var(--text-secondary) !important;
            margin: 1.2rem 0 !important;

        .markdown-body table {
            background: var(--surface);
            font-size: 0.85rem !important;
            margin: 1.2rem 0 !important;
        }

        footer {
            margin-top: 4rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.8rem;

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }

    <script id="markdown-raw" type="text/markdown">后端服务云托管适配改造要求
为确保你的多容器后端能平滑迁移到微信云托管并保持与 VPS 数据的互通，请按照以下清单进行改造。

1. 端口与监听 (Dockerfile & Code)
统一监听端口：确保所有容器在 Dockerfile 或启动命令中监听 80 端口。如果必须使用其他端口，请在部署时在云托管控制台显式指定。
绑定 IP 地址：启动服务时（如使用 uvicorn 或 gunicorn），必须绑定到 0.0.0.0 而非 127.0.0.1。
示例 (FastAPI)：uvicorn main:app --host 0.0.0.0 --port 80
2. 数据库与中间件连接 (VPC 适配)
替换连接地址：将代码中连接 MySQL、Redis、MongoDB 的地址由 localhost 或 127.0.0.1 替换为 VPS 的内网 IP（例如 10.0.x.x）。
使用环境变量：建议不要硬编码内网 IP，而是使用环境变量读取。
示例 (Python)：
python
import os
DB_HOST = os.getenv('DB_HOST', '10.0.0.5') # 默认值为你的 VPS 内网 IP
3. 路由与路径适配
路径前缀对齐：微信云托管网关转发时默认会保留路径前缀（如 /baostock/query）。
确保应用逻辑能处理该路径：
如果你的 FastAPI 路由原本就是 @app.get("/baostock/query")，则无需改动。
如果你原本的应用根路由是 @app.get("/query")，但在云托管配置了路径转发 /baostock/*，则需要在代码中加上 root_path="/baostock"。
4. 腾讯云 VPS 侧配置 (安全组)
网络关联：确保云托管环境与 VPS 处于同一地域，并开启了 VPC 互通。
开放内网访问：在 VPS 的“安全组”设置中，添加入站规则：
协议端口：3306 (MySQL), 6379 (Redis), 以及其他正在使用的内部端口。
来源：填入你的 VPC 网段（通常是 10.0.0.0/16），确保云托管容器能通过内网触达。
5. 打包与日志
依赖清单：确保 requirements.txt 完整，包含生产级服务器组件。
日志输出：确保日志输出到标准输出 (Stdout)，以便在云托管控制台日志流中实时查看。
轻量化：建议使用 python:3.9-slim 等较小的基础镜像，加快上传和启动速度。</script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
