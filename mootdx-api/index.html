<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mootdx-api Docs</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e0d0b;
            --bg-elev-1: #15130f;
            --bg-elev-2: #1c1915;
            --bg-elev-3: #2a2520;
            --ink: #ede3cc;
            --ink-dim: #dcd4c0;
            --ink-mute: #8c836e;
            --ink-whisper: #4d4538;
            --amber: #d4a23e;
            --amber-bright: #f0c968;
            --amber-soft: rgba(212, 162, 62, 0.18);
            --hair: #2a2520;
            --font-serif: 'Noto Serif SC', 'Songti SC', serif;
            --font-sans: 'Noto Sans SC', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
            --fs-xs: 12px;
            --fs-sm: 13px;
            --fs-base: 15px;
            --fs-md: 17px;
            --fs-lg: 20px;
            --fs-xl: 24px;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;
            --space-8: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: var(--fs-base);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: white;
            mix-blend-mode: overlay;
            opacity: 0.03;
            filter: contrast(120%) brightness(100%);
        }

        .header {
            padding: var(--space-8) var(--space-6);
            border-bottom: 1px solid var(--hair);
            background: var(--bg-elev-1);
        }

        .header-content { max-width: 1200px; margin: 0 auto; }

        .brand {
            font-family: var(--font-serif);
            font-size: var(--fs-xl);
            color: var(--amber);
            margin-bottom: var(--space-2);
            letter-spacing: 0.05em;
        }

        .subtitle {
            font-size: var(--fs-sm);
            color: var(--ink-mute);
            font-family: var(--font-mono);
        }

        .main {
            flex: 1;
            padding: var(--space-8) var(--space-6);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .section { margin-bottom: var(--space-8); }

        .section-title {
            font-family: var(--font-serif);
            font-size: var(--fs-lg);
            color: var(--ink);
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--hair);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-4);
        }

        .portal-card {
            background: var(--bg-elev-1);
            border: 1px solid var(--hair);
            padding: var(--space-6);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            position: relative;
            overflow: hidden;
        }

        .portal-card:hover {
            border-color: var(--amber);
            transform: translateY(-4px);
            background: var(--bg-elev-2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .portal-icon { font-size: 32px; color: var(--amber); margin-bottom: var(--space-2); }
        .portal-title { font-family: var(--font-serif); font-size: var(--fs-lg); color: var(--ink); }
        .portal-desc { font-size: var(--fs-sm); color: var(--ink-mute); }

        .recent-section {
            background: var(--bg-elev-1);
            border: 1px solid var(--hair);
            padding: var(--space-6);
        }

        .doc-list { display: flex; flex-direction: column; gap: var(--space-3); }

        .doc-item {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-2) 0;
            border-bottom: 1px solid var(--hair);
            text-decoration: none;
            color: var(--ink-dim);
            transition: all 0.15s;
        }

        .doc-item:hover { color: var(--amber); padding-left: var(--space-2); }

        .doc-date {
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            color: var(--ink-whisper);
            min-width: 130px;
        }

        .doc-title { flex: 1; font-size: var(--fs-base); }
        .doc-tag {
            font-size: 10px;
            color: var(--amber);
            border: 1px solid var(--amber-soft);
            padding: 1px 4px;
            text-transform: uppercase;
        }

        .footer {
            padding: var(--space-6);
            text-align: center;
            border-top: 1px solid var(--hair);
            color: var(--ink-whisper);
            font-size: var(--fs-xs);
            font-family: var(--font-mono);
        }
        
        .breadcrumb {
            margin-bottom: var(--space-4);
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            color: var(--ink-mute);
        }
        .breadcrumb a { color: var(--amber); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="brand">MOOTDX-API Portal</h1>
            <p class="subtitle">Local documentation index</p>
        </div>
    </header>

    <main class="main">
        <div class="breadcrumb"><a href="../docs/index.html">Project Hub</a> / MOOTDX-API</div>
        
<section class="section">
    <h2 class="section-title">MOOTDX-API 模块文档归档</h2>
    
<div class="recent-section">
    <div class="doc-list">
        
    </div>
</div>

</section>

    </main>

    <footer class="footer">
        Generated by Antigravity AI Portal Manager | 2026-05-15 22:09 | Asia/Shanghai
    </footer>
</body>
</html>
