version: "3.8"

services:
  # AkShare服务 - 财务/估值/龙虎榜数据
  akshare-api:
    build: ./akshare-api
    image: akshare-api:latest
    container_name: akshare-api
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s  # 降低检查频率节省资源
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'      # 限制最多使用0.5核CPU
          memory: 100M     # 降低到100MB
        reservations:
          cpus: '0.1'
          memory: 50M      # 预留50MB
    mem_limit: 100m        # Docker Compose v2 兼容性
    cpus: 0.5
    networks:
      - stock-network

  # BaoStock服务 - K线/指数/行业数据
  baostock-api:
    build: ./baostock-api
    image: baostock-api:latest
    container_name: baostock-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 100M
        reservations:
          cpus: '0.1'
          memory: 50M
    mem_limit: 100m
    cpus: 0.5
    networks:
      - stock-network

  # PyWencai服务 - 问财智能选股
  pywencai-api:
    build: ./pywencai-api
    image: pywencai-api:latest
    container_name: pywencai-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 100M
        reservations:
          cpus: '0.1'
          memory: 50M
    mem_limit: 100m
    cpus: 0.5
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge
