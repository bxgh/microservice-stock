version: "3.8"

services:
  # AkShare服务 - 财务/估值/龙虎榜数据
  akshare-api:
    build: ./akshare-api
    image: akshare-api:latest
    container_name: akshare-api
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s  # 降低检查频率节省资源
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'      # 限制最多使用0.5核CPU
          memory: 256M     # 增加到256MB，防止抓取概念板块时 OOM
        reservations:
          cpus: '0.1'
          memory: 128M      # 预留128MB
    mem_limit: 256m        # Docker Compose v2 兼容性
    cpus: 0.5
    networks:
      - stock-network

  # PyWencai服务 - 问财智能选股
  pywencai-api:
    build: ./pywencai-api
    image: pywencai-api:latest
    container_name: pywencai-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 50M
    mem_limit: 512m
    cpus: 0.5
    networks:
      - stock-network

  # Tushare服务 - 股票基础/日线/指数数据
  tushare-api:
    build: ./tushare-api
    image: tushare-api:latest
    container_name: tushare-api
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 50M
    mem_limit: 128m
    cpus: 0.4
    networks:
      - stock-network

  # Stock Manager - 数据管理中台
  stock-manager:
    build: ./stock-manager-api
    image: stock-manager-api:latest
    container_name: stock-manager
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - AKSHARE_API_URL=http://akshare-api:8000
      - PYWENCAI_API_URL=http://pywencai-api:8000
      - TUSHARE_API_URL=http://tushare-api:8000
      - MOOTDX_API_URL=http://mootdx-api:8000

    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - akshare-api
      - pywencai-api
      - tushare-api

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 64M
    mem_limit: 192m
    cpus: 0.5
    networks:
      - stock-network


  # Monitor Service - 监控评分与资金指标同步
  monitor-service:
    build: ./monitor-service
    image: monitor-service:latest
    container_name: monitor-service
    restart: unless-stopped
    ports:
      - "8006:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - AKSHARE_API_URL=http://akshare-api:8000/api/v1
    env_file:
      - .env
    depends_on:
      - akshare-api
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    mem_limit: 256m
    cpus: 0.4
    networks:
      - stock-network

  # Mootdx-api - 通达信直连行情服务
  mootdx-api:
    build: ./mootdx-api
    image: mootdx-api:latest
    container_name: mootdx-api
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - TDX_POOL_SIZE=${TDX_POOL_SIZE:-3}
      - TDX_HOSTS=${TDX_HOSTS:-}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge
