version: "3.8"

services:
  # AkShare服务 - 财务/估值/龙虎榜数据
  akshare-api:
    build: ./akshare-api
    image: akshare-api:latest
    container_name: akshare-api
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s  # 降低检查频率节省资源
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'      # 限制最多使用0.5核CPU
          memory: 128M     # 降低到100MB
        reservations:
          cpus: '0.1'
          memory: 50M      # 预留50MB
    mem_limit: 128m        # Docker Compose v2 兼容性
    cpus: 0.5
    networks:
      - stock-network

  # BaoStock服务 - K线/指数/行业数据
  baostock-api:
    build: ./baostock-api
    image: baostock-api:latest
    container_name: baostock-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 50M
    mem_limit: 128m
    cpus: 0.5
    networks:
      - stock-network

  # PyWencai服务 - 问财智能选股
  pywencai-api:
    build: ./pywencai-api
    image: pywencai-api:latest
    container_name: pywencai-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 50M
    mem_limit: 128m
    cpus: 0.5
    networks:
      - stock-network

  # Stock Manager - 数据管理中台
  stock-manager:
    build: ./stock-manager-api
    image: stock-manager-api:latest
    container_name: stock-manager
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - BAOSTOCK_API_URL=http://baostock-api:8000
      - AKSHARE_API_URL=http://akshare-api:8000
      - PYWENCAI_API_URL=http://pywencai-api:8000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - baostock-api
      - akshare-api
      - pywencai-api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 50M
    mem_limit: 128m
    cpus: 0.5
    networks:
      - stock-network

  # Frontend Mobile - React H5 App
  frontend-mobile:
    build: ./frontend-mobile
    image: frontend-mobile:latest
    container_name: frontend-mobile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - baostock-api
      - akshare-api
      - pywencai-api
      - stock-manager
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge
