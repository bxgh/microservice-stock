    <script id="markdown-raw" type="text/markdown"># Implementation Plan - E8-S3: 历史数据字段回填 (Historical Data Backfill)

本 Story 旨在修复 `stock_adjust_factor` 表中历史数据的字段缺失，确保 `back_adjust_factor` 与 `adjust_factor` 逻辑对齐。

## 需求解析
- **核心逻辑**：针对存量数据中 `back_adjust_factor` 为 NULL 的记录，将其值更新为同行的 `adjust_factor`。
- **背景**：在 S1 重构后，新入库数据已实现自动对齐，本项目负责清理历史遗留的 NULL 值。

## 依赖认证
- **数据表**：`stock_adjust_factor` (MySQL 5.7)。
- **操作权限**：具备 `UPDATE` 权限。

## 方案设计
### 1. 分批回填
使用 `LIMIT 10000` 分批执行 UPDATE，避免长事务锁表及对主从同步造成压力。
### 2. 验证
通过 `COUNT(*) WHERE ... IS NULL` 确保回填彻底。

## 任务列表 (Tasks)
- [x] **E8-S3-T1**: 执行分批回填 SQL (User 执行)
- [x] **E8-S3-T2**: 验证回填结果 (User 验证)
</script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
