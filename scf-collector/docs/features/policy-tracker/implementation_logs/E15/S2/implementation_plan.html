    <script id="markdown-raw" type="text/markdown"># Implementation Plan - E15-E2: 二阶段分析与 5 星政策 Self-Consistency 投票落地

本方案针对 AI 政策分析引擎开展二阶段分流（Staged Analysis）与高价值（5星）政策的多路投票（Self-Consistency Voting）设计与实施，旨在大幅削减非必要大模型流量开销（月度预算从 ¥15 降至 ≤ ¥2，降低 87%），同时通过置信度双保险和召回偏置机制确保零漏报，并针对 5 星政策引入高可靠多数投票算法保障核心质量不退化。

## 需求解析与核心逻辑 (3句话)

1. **初筛低星阻断**：所有非规则路径的政策在入库后，首先由极低成本的 `deepseek-chat` (Flash模式，非思考) 进行极速初筛与分类，对 1-3 星且置信度达标的政策直接使用初筛摘要落库并终结流程。
2. **高星深度透传**：对判定为 4-5 星或初筛置信度不足（< 0.70）的模糊政策，强制触发第二阶段 `deepseek-reasoner` (Pro-Thinking 模式) 深度分析与措辞对比。
3. **5星投票与偏置**：对于初筛锁定的 5 星重磅政策，拉起 3 路并行推理大模型执行 Self-Consistency 多数投票与板块交集提取，若严重分歧则自动触发人工介入告警，并融入“高召回率”关键词偏置机制确保不漏报任何政策拐点。

---

## 激活角色说明

*   `[Macro Policy Architect] (宏观政策架构师)`：负责统筹分级路由控制流及金融分析契约的严密性。
*   `[Data Integrity Steward] (数据质量掌门人)`：负责投票决策的一致性、板块取交集合并算法、以及灰度与质量回归。
*   `[Senior Python Backend Engineer] (资深异步后端工程师)`：负责高效的 `asyncio.gather` 并行调用、Pydantic v2 强契约解析、及熔断兜底。

---

## User Review Required

> [!IMPORTANT]
> **1. 召回偏置与置信度双保险**
> *   **宁杀错不放过**：对于包含“结构性”、“系统性”、“重大改革”等 14 个核心宏观关键词的标题/内容，强制要求初筛模型或代码层锁定 `importance_level >= 4`。
> *   **置信度升级**：一旦大模型吐出的 `triage_confidence` 低于 `0.70`，即使其打分为 1-3 星，代码层必须无条件升级到第二阶段深度推理分析，防止模型的边缘判定幻觉。
> 
> **2. 5 星政策的 3 路并行成本评估**
> *   5 星政策每月生产量极低（预估 5-10 条），3 路并行 `deepseek-reasoner` 单词调用单条累计成本约为 `¥0.042 * 3 = ¥0.126`，月增加开销仅 `¥0.6-1.3`，ROI（投入产出比）极高，设计完全采纳。
>
> **3. 灰度与回滚开关**
> *   引入 `STAGED_ANALYSIS_ENABLED` 环境变量作为一键回滚总闸（设为 `false` 则退化为 v2.0 的“100%大模型全量分析”）。
> *   引入 `STAGED_ANALYSIS_GRAYSCALE_PCT` 环境变量（0-100）支持基于 `policy_id % 100` 的平滑采样控制。

## Open Questions

> [!NOTE]
> **Q1: 1-3星初筛摘要是否需要极简输出？**
> *   **决策**：是的。为了保持 DWD 层 `summary` 字段的非空强契约，初筛模型的 JSON 契约中新增了 `triage_summary`（≤ 40 字）字段。对于 triage_only 的政策，该字段将直接作为最终摘要，从而实现全链路仅一次 Flash 调用（耗时 < 1.5s，单条成本 < ¥0.0005）。

#### [MODIFY] [staged_analyzer.py](file:///e:/gitee/microservice-stock/scf-collector/shared/utils/staged_analyzer.py)
*   **修改内容**：
    1. **重构** `analyze_policy` 核心判定树。
    2. 若规则未命中且 `STAGED_ANALYSIS_ENABLED` 为真，则进入二阶段路由逻辑。
    3. 执行灰度采样（`policy_id % 100 < STAGED_ANALYSIS_GRAYSCALE_PCT`），未中灰度者退回 standard LLM path。
    4. 灰度内用户，执行 `_run_triage_classifier(row)`（使用 Flash 模式调用 `TRIAGE_CLASSIFIER_SYSTEM_V1`）。
    5. **召回偏置兜底**：代码层双重过滤：若标题/正文前300字命中召回偏置关键词，强制设为需要深度分析。
    6. **判定路由**：
        *   **Stage 1 终结 (triage_only)**：若 `importance_level < 4` 且 `triage_confidence >= 0.70`。直接封装 triage_summary，落库主表 `dwd_policy_analysis`（单条成本约 0 元），完成分析。
        *   **Stage 2 深度分析 (triage_and_deep)**：若为 4 星，或置信度不足强制升级（`triage_borderline=1`）。调用 `self.analyzer.analyze_policy(row)` 执行标准 Pro 级深入分析。

        *   使用 `asyncio.gather` 并行派生 3 个 `self.analyzer.analyze_policy(row, force_deep_mode="pro-thinking", disable_db_write=True)` 异步任务。
        *   执行多数投票（Majority Vote）对齐 `intensity_change` 及 `importance_level`；对板块交集 `sectors_positive` / `sectors_negative` 提取 >= 2 次重合的板块。
        *   计算一致率 `voting_consistency_rate`。若 3 次输出完全分歧，标记 `requires_human_review=1` 并在日志中抛出 ERROR 触发警报。
        *   聚合最优投票结果，一次性写入物理表并更新 ODS。

                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
</body>
</html>
