    <script id="markdown-raw" type="text/markdown"># E15: AI 政策分析引擎效率与成本优化实施方案

> 版本:v1.1
> 起草日期:2026-05-17
> 修订日期:2026-05-18
> 状态:Draft for Review
> 依赖:E14-S2 v2.0 已上线

## v1.1 修订说明

基于 DeepSeek 官方文档(`api-docs.deepseek.com`,2026-05-18 核实)的事实修正:

1. **缓存机制描述纠正**:DeepSeek 缓存最小单元为 **64 tokens**,不是 1024(Anthropic 的数字),也不是"无阈值"。该数字极易跨越,**对 prompt 设计基本不构成约束**。
2. **新增机制认知**:DeepSeek 缓存有"**共享前缀自动发现**"机制(多次请求共同前缀自动持久化),提升 Prefix-Freeze 改造的容错性。
3. **新增 E4-S5 错峰时段调度**:DeepSeek 官方提供 00:30-08:30 北京时间错峰优惠,本方案纳入批处理任务调度策略。
4. **目标命中率上调**:从 60%(目标 80%)上调至 **80%(目标 90%)**,理由是 DeepSeek V4 平台均值 Pro 95% / Flash 91%,我们的政策场景理应能逼近平台均值。
5. **TBD-1 关闭**:缓存最小单元已确认为 64 tokens。
6. **里程碑顺序调整**(基于评审反馈):用并行度替代串行等待,**E1 + E3-S1 + E4 准备工作同期推进**,**E4 切换主流量单独做**。

## 背景

E14-S2 v2.0 上线后,通过 `meta_llm_daily_cost` 与 `dwd_policy_analysis` 真实生产数据观察到以下结构性问题:

| 现象 | 真实数据 | 问题诊断 |
|---|---|---|
| 缓存命中率 | 10.3% | system prompt 位置不当,缓存机制基本未发挥作用 |
| Level 3 政策占比 | 98.4% | 绝大多数调用是常规政策,但仍走完整分析流程 |
| 单条 Level 3 成本 | ~¥0.05 | 用 reasoner(贵模型)分析无需思考的常规公告 |
| 月度总成本 | ~¥15 | 主要消耗在 Level 3 的过度分析 |
| 结构化政策(LPR/OMO/MLF)占比 | TBD,估算 15-20% | LLM 输出与规则提取结果高度重合,LLM 价值约等于零 |

**对照参考**:DeepSeek V4 平台平均缓存命中率 Pro 约 95% / Flash 约 91%。我们的 10.3% 是**异常低值**,改造空间巨大。

**结论**:v2.0 解决了"能不能跑"和"出问题能不能查"的基础设施问题,但**没有解决"该不该跑"和"用多大火力跑"的策略问题**。本方案聚焦后者。

## 目标

| 指标 | 当前 | 目标 | 降幅/提升 |
|---|---|---|---|
| 月度 LLM 总成本 | ¥15 | ≤ ¥2 | -87% |
| **缓存命中率** | **10.3%** | **≥ 80%(目标 90%)** | **+676%** |
| Level 3 单条平均成本 | ¥0.05 | ≤ ¥0.005 | -90% |
| Level 3 处理耗时(P50) | 8-12 秒 | ≤ 2 秒 | -75% |
| 5 星政策分析深度 | 单次调用 | 支持 self-consistency 投票 | 质量提升 |
| 结构化政策 LLM 调用 | 100% | 0%(全部走规则路径) | -100% |

## 范围

- 结构化政策的规则提取路径(`shared/extractors/rule_based/`)
- 二阶段分析调度逻辑(`shared/analyzers/staged_analyzer.py`)
- Prompt 重构与 schema 优化(`shared/utils/prompts.py` v3 版本)
- Prefix-Freeze 改造(影子模式验证)
- **错峰时段调度**(新增,v1.1)
- 应用层响应缓存(`shared/utils/response_cache.py`)
- 缓存命中率实时监控
- 思考预算的场景化配置

## 非目标

- **不替换 LLM 供应商** — 继续使用 DeepSeek,不引入 Claude/GPT/通义/智谱
- **不引入本地部署模型** — 调用量级别(月 300 条)远未达到自部署 ROI 临界点
- **不做模型蒸馏/微调** — 开发成本远超预期收益
- **不改变 v2.0 数据模型基础架构** — DDL 仅做增量扩展,不破坏现有数据
- **不做 batch API 优化** — 已在 v2.0 待确认事项中,本方案不依赖
- **不做"5 条政策合并 JSON 数组"批处理** — 质量风险明确,不采纳
- **不优化通知模板** — 保持 v2.0 现有逻辑

## E1 规则零成本路径(Rule-Based Bypass)

对高度模板化的政策,**完全跳过 LLM**,用规则提取生成结构化分析结果。预计耗时 2 个工作日。

### E1-S1 政策模板识别与字段提取器

**作为** 政策分析引擎,**我希望** 识别"高度结构化"的政策类型并用规则提取核心字段,**以便** 完全避免对这类政策的 LLM 调用。

#### 设计说明

**适用 policy_type 清单**(初版):

| policy_type | 提取字段 | 示例输入 | 示例输出 |
|---|---|---|---|
| `lpr_announcement` | 1Y LPR、5Y LPR、生效日期 | "1 年期贷款市场报价利率(LPR)为 3.0%,5 年期以上 LPR 为 3.5%" | `{1y: 3.0, 5y: 3.5, effective: "2026-05-20"}` |
| `omo_operation` | 操作金额、利率、期限 | "今日开展 1000 亿元 7 天期逆回购操作,中标利率 1.5%" | `{amount: 1000, rate: 1.5, term: 7}` |
| `mlf_operation` | 操作金额、利率、期限 | 同上 | 同上 |
| `slf_operation` | 操作金额、利率、期限 | 同上 | 同上 |
| `personnel_announcement` | 任职人员、职务、机构 | "免去 X 的 Y 职务" | `{action: "免去", person: "X", role: "Y"}` |
| `holiday_notice` | 休市日期范围 | "5 月 1 日至 5 日休市" | `{start: "2026-05-01", end: "2026-05-05"}` |

#### 方案对比

| 维度 | 方案 A:全部走 LLM | 方案 B:规则零成本路径 |
|---|---|---|
| 单条成本 | ¥0.05 | ¥0(纯 CPU 计算) |
| 单条耗时 | 8-12 秒 | < 100ms |
| 字段准确率 | 95%(LLM 偶尔念错数字) | 99.9%(正则确定性提取) |
| 维护成本 | 低(prompt 即可) | 中(每种类型一个规则) |
| 新政策类型适应 | 自动适应 | 需新增规则,但这些类型极稳定 |

#### 选型结论

选择 **方案 B**。这类政策格式数十年来高度稳定,正则规则一次写好长期受益。**LLM 在这类任务上不仅贵,质量还不如规则**。

#### 任务

- E1-S1-T1 创建 `shared/extractors/rule_based/` 目录与 `BaseExtractor` 抽象类
- E1-S1-T2 实现 `LPRExtractor`、`OMOExtractor`、`MLFExtractor`、`SLFExtractor`
- E1-S1-T3 实现 `PersonnelExtractor`、`HolidayExtractor`
- E1-S1-T4 编写规则匹配优先级:title 模板 + 正文关键词双重确认
- E1-S1-T5 实现 fallback:任一规则提取失败时,标记 `bypass_failed=1` 并回退 LLM 路径
- E1-S1-T6 在 `dwd_policy_analysis` 增加字段 `analysis_path VARCHAR(20) DEFAULT 'llm'`(`llm` / `rule` / `rule_then_llm`)

#### 验收标准(AC)

- **AC1**:LPR 公告规则提取
  - **Given** 一条 title 含"贷款市场报价利率"的 PBC 政策
  - **When** `LPRExtractor.extract(content)` 被调用
  - **Then** 返回字典包含 `lpr_1y`(float)、`lpr_5y`(float)、`effective_date`(date),且数值与原文数字误差为 0

- **AC2**:提取失败 fallback
  - **Given** 一条 title 匹配 `lpr_announcement` 但正文格式异常的政策
  - **When** 规则提取失败
  - **Then** 系统自动回退到 LLM 路径,`analysis_path='rule_then_llm'`,日志记录 WARN

- **AC3**:零 token 消耗
  - **Given** 一条成功走规则路径的政策
  - **When** 查询其 `dwd_policy_analysis` 记录
  - **Then** `input_cache_hit_tokens=0`、`input_cache_miss_tokens=0`、`output_tokens=0`、`cost_cny=0`

### E1-S2 模板化 Summary 生成

**作为** 数据消费方,**我希望** 规则路径生成的 summary 与 LLM 路径在 schema 上一致,**以便** 下游通知、查询无需特殊处理。

#### 设计说明

每个 extractor 配套一个 summary 模板:

```python
LPR_SUMMARY_TEMPLATE = (
    "央行公布最新 LPR:1 年期 {lpr_1y}%,5 年期以上 {lpr_5y}%,自 {effective_date} 起执行。",
    "本期 LPR {change_desc}",  # 与上期对比
    "{implication}"  # 简短影响描述,基于变化方向的预设模板
)
```

**重要约束**:模板化 summary **不应假装有 LLM 的深度**。它的价值在准确、稳定、零成本,**不是替代 LLM 的语义理解**。

#### 任务

- E1-S2-T1 为每个 extractor 配套 summary 模板
- E1-S2-T2 实现 LPR/OMO/MLF 的"与上期对比"逻辑(数字 diff)
- E1-S2-T3 sectors_positive/negative 字段用预设映射(如 LPR 下调 → 银行偏空、地产偏多)
- E1-S2-T4 importance_level 用规则判定(如 LPR 变动 → 4 星,LPR 不变 → 3 星)

#### 验收标准(AC)

- **AC1**:输出 schema 一致
  - **Given** 规则路径完成提取
  - **When** 写入 `dwd_policy_analysis`
  - **Then** `summary`、`importance_level`、`sectors_positive` 等字段全部填充,与 LLM 路径的字段完全一致

- **AC2**:LPR 变动评级
  - **Given** 本期 LPR 相比上期变化 ≥ 5 个基点
  - **When** 写入分析结果
  - **Then** `importance_level=4`,`summary` 中包含"调整"字样

- **AC3**:LPR 未变评级
  - **Given** 本期 LPR 与上期完全一致
  - **When** 写入分析结果
  - **Then** `importance_level=3`,`summary` 中包含"维持不变"字样

### E1-S3 灰度上线与质量校验

**作为** 系统运维方,**我希望** 规则路径上线前与 LLM 路径并行比对,**以便** 在切流前发现 schema 偏差。

#### 任务

- E1-S3-T1 启用"双路并行"模式 7 天:规则路径写主表,LLM 路径写影子表 `dwd_policy_analysis_shadow`
- E1-S3-T2 编写比对脚本,统计两路输出的字段一致率
- E1-S3-T3 一致率 ≥ 95% 后,关闭影子写入
- E1-S3-T4 准备 rollback 脚本:`analysis_path` 字段强制设回 `llm` 即可

#### 验收标准(AC)

- **AC1**:双路写入成功
  - **Given** 灰度期开启
  - **When** 一条 LPR 政策到达
  - **Then** `dwd_policy_analysis` 中 `analysis_path='rule'` + `dwd_policy_analysis_shadow` 中 `analysis_path='llm'` 各有一条记录

- **AC2**:字段一致率达标
  - **Given** 灰度运行满 7 天,产生 ≥ 30 条对照数据
  - **When** 执行比对脚本
  - **Then** `lpr_1y/lpr_5y/effective_date` 字段一致率 = 100%,`summary` 语义一致率 ≥ 90%(人工抽检)

## E2 二阶段分析(Staged Analysis)

将"分析所有政策"升级为"先轻量分类,再按重要性深度分析"。预计耗时 4 个工作日。

### E2-S1 轻量初筛 Prompt 与调用层

**作为** 政策分析引擎,**我希望** 用极低成本的初筛调用先判断政策重要性,**以便** 仅对重要政策投入完整分析资源。

#### 设计说明

**初筛 prompt 设计原则**:
- 输出极短(单条 JSON,< 30 token)
- 仅做分类任务,不做语义理解
- 用 v4-flash 非思考模式
- 输入仅政策标题 + 前 500 字摘要

```yaml
prompt_name: triage_classifier
prompt_version: v1
模型: deepseek-v4-flash
thinking: false
输出 schema:
  {
    "importance_level": 1-5,
    "policy_type": "<枚举值>",
    "requires_deep_analysis": true|false,
    "triage_confidence": 0.0-1.0   # v1.1 新增,见 AC4
  }
```

**召回偏置策略**(v1.1 新增,基于评审反馈):

两类误判的成本严重不对称:

| 误判类型 | 后果 | 量化代价 |
|---|---|---|
| 漏报 5 星 → 3 星(假阴性) | 投资决策错失重大信号 | 万元级潜在损失 |
| 误判 3 星 → 4 星(假阳性) | 多花 ¥0.04/条 | 月度增量 ¥1-2 |

因此**初筛必须采取高召回率策略,宁杀错不放过**。具体实现:

1. **关键词触发硬性最低评级**:
   - 含"结构性"、"系统性"、"重大改革"、"重要部署"、"首次"、"全面"、"加快推进"、"转向"、"中央"、"国务院"、"政治局"、"整顿"、"专项整治"、"风险防范"任一关键词 → 最低 `importance_level=4`
   - 含具体数字变化(利率、准备金率、税率)→ 最低 `importance_level=4`
   - 仅在内容明确为节假日通知、人事任命、办公场所变更、纯流程性公告时,才允许判 1-3 星

2. **置信度双保险**:
   - LLM 输出 `triage_confidence` 字段
   - **置信度 < 0.7 时,强制升级到深度分析**,不论 importance 评级

#### 调用层流程

```mermaid
graph TD
    A[新政策入库] --> B{规则路径可处理?}
    B -->|是| C[规则提取,end]
    B -->|否| D[二阶段初筛调用]
    D --> E{importance >= 4 OR confidence < 0.7?}
    E -->|否| F[初筛结果即最终结果]
    E -->|是| G[完整 LLM 分析]
    G --> H{importance == 5?}
    H -->|是| I[Self-Consistency 投票]
    H -->|否| J[单次分析即可]
    I --> K[写入主表]
    J --> K
    F --> K
```

- E2-S1-T1 编写 `TRIAGE_CLASSIFIER_V1` prompt,包含召回偏置指令(关键词清单 + 置信度要求)
- E2-S1-T2 实现 `StagedAnalyzer` 类,封装"初筛 → 条件深度"两阶段调度
- E2-S1-T3 初筛失败处理:解析失败时,默认走完整分析(保守策略)
- E2-S1-T4 在 `dwd_policy_analysis` 增加字段:
  - `analysis_stage VARCHAR(20)`(`triage_only` / `triage_and_deep` / `triage_and_voting`)
  - `triage_confidence DECIMAL(3,2)` **v1.1 新增**
  - `triage_borderline TINYINT(1) DEFAULT 0` **v1.1 新增**

  - **Given** 一条普通行业公告

  - **Then** 初筛判定为 Level 3,**不触发**第二阶段调用,`analysis_stage='triage_only'`,落库的 `summary` 来自初筛结果

### E2-S2 5 星政策 Self-Consistency 投票

**作为** 投资决策者,**我希望** 5 星重大政策有更稳健的判断,**以便** 降低 LLM 偶发抽风的影响。

#### 设计说明

**触发条件**:`importance_level == 5` 的政策

**投票机制**:
- 调用 3 次完整分析(`deepseek-v4-pro` + `thinking=on` + `reasoning_effort=high`)
- 对关键字段做多数投票:`intensity_change`、`importance_level`(确认)、`sectors_positive`(取交集)
- 3 次结果不一致时:`requires_human_review=1`,触发人工告警

**成本评估**:
- 5 星政策每月约 5-10 条
- 单次 ¥0.042(折扣价)× 3 = ¥0.126/条
- 月增量成本:¥0.6-1.3
- 完全在预算内

#### 任务

- E2-S2-T1 实现 `SelfConsistencyVoter` 类
- E2-S2-T2 实现多数投票逻辑(字段级)
- E2-S2-T3 实现不一致告警(邮件 + 数据库标记)
- E2-S2-T4 在 `dwd_policy_analysis` 增加字段 `requires_human_review TINYINT(1) DEFAULT 0`、`voting_consistency_rate DECIMAL(5,4)`

#### 验收标准(AC)

- **AC1**:5 星触发投票
  - **Given** 一条政策初筛后 `importance_level=5`
  - **When** 进入深度分析阶段
  - **Then** 触发 3 次 v4-pro thinking 调用,**不复用上次结果**

- **AC2**:多数投票生效

  - **When** 投票合并
  - **Then** 最终结果 `intensity_change='增强'`,`voting_consistency_rate=0.6667`

- **AC3**:不一致触发人工复核
  - **Given** 3 次调用各返回不同的 `intensity_change`
  - **When** 投票
  - **Then** `requires_human_review=1`,发送告警邮件

### E3-S1 输出 Schema 极简化

**作为** 成本敏感方,**我希望** 输出 JSON 不含冗余字段,**以便** 减少 output token 消耗。

**审计当前 v2.0 schema 的冗余项**(基于 `dwd_policy_analysis` 实际字段):

| 字段 | 评估 | 处置 |
|---|---|---|
| `summary` | 必需 | 保留 |
| `importance_level` | 必需 | 保留 |
| `importance_reason` | 部分场景冗余(用 enum 可推导) | **精简**为 ≤ 50 字 |
| `sectors_positive/negative` | 必需 | 保留 |
| `sector_count` | 数组长度可计算 | **删除**(若曾存在) |

| `key_differences` | 仅措辞对比场景必需 | 同上 |
| `implication` | 与 summary 部分重合 | **精简**为 ≤ 100 字 |

### E3-S2 结构化输入预处理

**作为** 政策分析引擎,**我希望** 进入 LLM 的政策内容已经被结构化提取,**以便** 减少 input token 中的"包装"消耗。

#### 设计说明

**核心思路**:政策原文里大量的"包装"内容(开头致辞、文号说明、附件清单、流程说明)对分析无价值,送入 LLM 浪费 token。

#### 预处理管道

```
原始政策(3000-5000 字)
    ↓
[1] 元数据提取(发文号、机构、生效日期 — 用规则)
    ↓
[2] 关键段落提取(基于 policy_type 的章节定位 — 来自 v2.0 E3-S2)
    ↓
[3] 结构化封装(JSON 而非散文)
    ↓
LLM 输入(500-1000 字 + 元数据)
```

#### 实测预估

| 政策类型 | 原文 token | 预处理后 token | 减幅 |
|---|---|---|---|
| 货币政策执行报告 | ~80000(超长) | ~3000 | -96% |
| 央行新闻发布会 | ~10000 | ~2000 | -80% |
| 行长讲话 | ~5000 | ~1500 | -70% |
| 部委规章 | ~3000 | ~1200 | -60% |
| 一般行业公告 | ~1500 | ~800 | -47% |

#### 任务

- E3-S2-T1 实现 `PolicyPreprocessor` 类,串联 v2.0 `SegmentExtractor` 与新增的"元数据提取"
- E3-S2-T2 设计结构化 user message 模板:
  ```json
  {
    "meta": {"issuer": "...", "doc_no": "...", "effective_date": "..."},
    "title": "...",
    "core_segment": "..."
  }
  ```
- E3-S2-T3 在 prompt 中明确告知"输入为结构化 JSON",避免 LLM 困惑
- E3-S2-T4 失败 fallback:预处理失败时,使用 v2.0 原始流程(全文 + 截断)

### E3-S3 思考预算精细化

**作为** 成本敏感方,**我希望** `reasoning_effort` 按场景配置而非一刀切,**以便** 避免 thinking token 过度消耗。

#### 设计说明

**v2.0 现状**:措辞对比统一使用 `reasoning_effort=medium`,深度分析使用 `high`。

**v3.0 优化**:按 (policy_type × importance_level) 二维配置:

```yaml
reasoning_effort_matrix:
  monetary_policy_report:
    4: medium    # 季度货政报告,中等思考即可
    5: high      # 政策转向期,深度思考
  government_work_report:
    4: medium
    5: high
  regulation_release:
    4: low       # 监管规章变化通常清晰,low 即可
    5: medium
  default:
    4: low
    5: medium
```

**注**:DeepSeek V4 的 `reasoning_effort` 仅支持 `high` 和 `max` 两档(2026-04 V4 发布时调整,旧的 `low`/`medium` 已映射为 `high`)。上述配置在 V4 上等价于"启用 thinking + high"vs "启用 thinking + max"两档,具体调用前需以官方 SDK 实际能力为准。**TBD 需实测验证 effort 档位映射**。

## E4 Prefix-Freeze 缓存改造

将缓存命中率从 10.3% 提升到 80%+。预计耗时 3 个工作日。

### E4-S1 System/User Message 结构重组

**作为** 成本敏感方,**我希望** 所有静态内容前置到 system message,**以便** 充分利用 DeepSeek prompt caching。

#### 设计说明(v1.1 修正)

**DeepSeek prompt caching 机制**(基于 `api-docs.deepseek.com` 2026-05-18 核实):

1. **最小缓存单元:64 tokens**
   - 官方原文:"The cache system uses 64 tokens as a storage unit; content less than 64 tokens will not be cached"
   - **不是 Anthropic 的 1024 tokens**(那是 Anthropic 的政策)
   - 64 tokens 极易跨越,**对实际 prompt 设计基本不构成约束**

2. **前缀匹配规则**
   - 必须从**第 0 token 开始完全相同**才命中
   - 中间部分的匹配不算
   - 命中部分按 64 token 粒度向下取整计费

3. **共享前缀自动发现机制**(v1.1 关键新增认知)
   - 多次请求即使后续内容不同,**系统会自动检测共同前缀并持久化**
   - 这意味着改造的容错性比预想更好——即使第一次没设计完美,系统会自动找到最长共享前缀
   - 但**不能依赖此机制偷懒**,前缀显式固定的命中率更高

4. **固定 token 间隔的持久化**
   - 长输入会按"固定 token 间隔"自动切分为多个缓存单元
   - 防止超长前缀因从未达到结束位置而完全不被缓存

5. **价格倍数**
   - V4-Flash:命中 ¥0.02/M vs 未命中 ¥1/M(1/50)
   - V4-Pro:命中 ¥0.025/M(折扣)/ ¥0.1/M(原价)vs 未命中 ¥3/M(折扣)/ ¥12/M(原价)(1/120)

6. **平台命中率参考**
   - DeepSeek 官方公开数据:V4-Pro 约 95%,V4-Flash 约 91%
   - 本系统当前 10.3% 是异常低值,**改造后目标 80%(可达 90%)**

7. **缓存是 best-effort**
   - 即使前缀完全相同,也不保证 100% 命中(系统会自动清理冷缓存)
   - 因此需要心跳保活(详见 E4-S4)

#### 重构对照

```python
# ❌ v2.0 当前(命中率 10.3% 的根因)
messages = [
    {
        "role": "system",
        "content": (
            f"分析以下政策:\n{policy_text}\n\n"  # 政策内容前置 = 缓存失效
            "规则:..."
            "Few-shot 1:..."
        )
    }
]

# ✅ v3.0 改造后
messages = [
    {
        "role": "system",
        "content": (
            # 完全固定的角色、规则、schema、few-shot
            STATIC_SYSTEM_PROMPT  # 长度 ≥ 1000 token,放大缓存绝对收益
        )
    },
    {
        "role": "user",
        "content": f"请分析以下政策:\n{policy_text}"  # 唯一变量
    }
]
```

#### Prompt 长度策略(v1.1 修正)

| 长度 | 缓存收益评估 |
|---|---|
| < 64 tokens | **完全不会被缓存**(官方硬阈值) |
| 64-500 tokens | 可缓存,但绝对节省小 |
| 500-1000 tokens | 中等收益 |
| **≥ 1000 tokens** | **推荐区间**,放大缓存绝对收益,**与"垫厚 system prompt"建议一致** |
| > 4000 tokens | 收益边际递减,需评估 system 长度是否合理 |

**关键认知**:**建议 system prompt 长度 ≥ 1000 tokens 不是因为有 1024 硬阈值**(没有),**而是因为被缓存的 token 越多,绝对节省越大**。把详细的 schema、规则、申万板块关键词、few-shot examples 都塞进 system,即可自然达到此长度。

- E4-S1-T4 验证 system prompt 长度 ≥ 1000 token(放大缓存收益,不是为了跨越阈值)

  - **Given** 任意一次调用
  - **When** 检查 system message 内容

#### 验收标准(AC)

- **AC1**:双调用成功
  - **Given** 影子模式开启
  - **When** 一条政策到达
  - **Then** 主表 + 影子表各产生一条记录,且 `prompt_version` 不同(v2 vs v3)

- **AC2**:质量验证通过
  - **Given** 7 天双跑数据,样本 ≥ 100 条
  - **When** 执行对照脚本
  - **Then** `importance_level` 一致率 ≥ 95%,`sectors_positive` 交集率 ≥ 90%

### E4-S3 实时缓存命中率监控

**作为** 系统运维方,**我希望** 缓存命中率实时可见,**以便** 异常下降时立即告警。

#### 设计说明

**监控查询**(每 5 分钟跑一次):

```sql
SELECT 
    DATE(created_at) AS d,
    HOUR(created_at) AS h,
    SUM(input_cache_hit_tokens) / NULLIF(SUM(input_cache_hit_tokens + input_cache_miss_tokens), 0) AS hit_rate,
    COUNT(*) AS calls,
    SUM(cost_cny) AS hourly_cost
FROM dwd_policy_analysis
WHERE created_at > NOW() - INTERVAL 24 HOUR
  AND analysis_path = 'llm'
GROUP BY d, h
ORDER BY d DESC, h DESC;
```

**告警规则**(v1.1 修正,基于上调后的目标):
- 连续 3 小时命中率 < 60% → P1 告警(原 40%)
- 单小时命中率 < 30% 且调用数 ≥ 5 → P2 告警(原 20%)

#### 任务

- E4-S3-T1 实现监控查询脚本,定时输出到日志/仪表盘
- E4-S3-T2 实现告警规则引擎
- E4-S3-T3 编写命中率周报模板

#### 验收标准(AC)

- **AC1**:命中率持续达标
  - **Given** Prefix-Freeze 上线 7 天后
  - **When** 查询过去 7 天命中率
  - **Then** 日均命中率 ≥ 80%(P50),≥ 70%(P25)

- **AC2**:异常告警
  - **Given** 某 hour 命中率突降至 20%
  - **When** 监控扫描到
  - **Then** 1 小时内触发告警邮件

### E4-S4 缓存预热保活脚本

**作为** 系统运维方,**我希望** 缓存维持热度,**以便** 突发调用(如政治局会议日)时立即享受打折价。

#### 设计说明

**机制**:
- 每 30 分钟发一次"心跳调用"(同 system prompt,极简 user message)
- 单次成本 < ¥0.001,可忽略
- 维持 DeepSeek 服务端的缓存 prefix 不被驱逐

**关于缓存 TTL**:
- 官方文档:"Unused cache entries are automatically cleared after a period"
- 具体时长**未明示**,**TBD 需通过实验探测**
- 非官方报告称"数小时至数天",作为参考但不依赖

**保守策略**:30 分钟间隔的心跳是基于"安全边际",实际可能 1-2 小时也够。需要实测探测最优间隔。

#### 任务

- E4-S4-T1 编写 `keep_alive.py` 心跳脚本
- E4-S4-T2 配置 cron 每 30 分钟运行(或 SCF 定时器),**注意:错峰时段(00:30-08:30)不需要心跳**(此时反正享受错峰折扣)
- E4-S4-T3 在 `meta_llm_daily_cost` 表中标记心跳调用(`call_type='heartbeat'`),不计入业务成本
- E4-S4-T4 编写"缓存 TTL 探测脚本":定时间隔从 1 小时到 24 小时分别测试命中率,找最优心跳频率

#### 验收标准(AC)

- **AC1**:心跳生效
  - **Given** 心跳脚本已运行 1 小时
  - **When** 一次真实业务调用到达
  - **Then** 该次调用的缓存命中率 ≥ 50%(无冷启动惩罚)

**作为** 成本敏感方,**我希望** 非实时任务自动调度到错峰时段,**以便** 享受 DeepSeek 官方提供的错峰优惠折扣。

## E5 应用层响应缓存

对重复政策内容直接复用历史结果,跳过 LLM 调用。预计耗时 1 个工作日。

### E5-S1 缓存键设计与存储

**作为** 政策分析引擎,**我希望** 重复内容跳过 LLM 调用,**以便** 在 prompt 调优、回归测试、异常重试时零消耗。

#### 设计说明

**缓存键**:`MD5(prompt_name + prompt_version + model + policy_content_normalized)`

**存储**:MySQL `meta_response_cache` 表,**不引入 Redis**(规模不需要)

```sql
CREATE TABLE meta_response_cache (
    cache_key CHAR(32) PRIMARY KEY,
    prompt_name VARCHAR(50),
    prompt_version VARCHAR(10),
    model_name VARCHAR(50),
    response_content MEDIUMTEXT,
    hit_count INT DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    last_hit_at TIMESTAMP,
    KEY idx_last_hit (last_hit_at)
);
```

**淘汰策略**:每月清理 30 天未命中的缓存。

#### 任务

- E5-S1-T1 创建 `meta_response_cache` 表
- E5-S1-T2 实现 `ResponseCache` 类,封装查询/写入/统计
- E5-S1-T3 在 `LLMClient.chat()` 入口注入缓存查询
- E5-S1-T4 编写月度淘汰脚本

#### 验收标准(AC)

- **AC1**:缓存命中跳过 LLM
  - **Given** 同一政策内容 + 同一 prompt 版本已分析过
  - **When** 再次发起分析
  - **Then** 不发起任何 LLM 调用,直接返回缓存结果,`dwd_policy_analysis.analysis_path='cache'`

- **AC2**:缓存失效新版本
  - **Given** prompt 已升级到新版本
  - **When** 用新版本分析旧政策
  - **Then** 缓存未命中(key 不同),正常调用 LLM

## E6 增量(Diff)分析

对高相似度的连续政策,仅分析差异部分。预计耗时 5 个工作日。**优先级 P2,可延后到下个 sprint**。

### E6-S1 政策相似度检测

**作为** 政策分析引擎,**我希望** 识别"近似上一期"的政策,**以便** 走 diff 分析路径。

#### 设计说明(v1.1 修正)

**相似度算法**:SimHash(64 位)+ 汉明距离

- 汉明距离 ≤ 3:高度相似,走 diff 路径
- 汉明距离 4-8:中度相似,记录提示但走完整路径
- 汉明距离 > 8:常规处理

**关键约束**(v1.1 修正,基于评审反馈):

SimHash 的真实特性:
- SimHash **本身对词序不敏感**(这是其设计优点,本质是词袋哈希)
- **但对长文本中"非主题内容"敏感**:如果开头/结尾的套话占比大,会主导哈希值
- 政策文件中开头致辞、文号说明、附件清单占比可达 30-50%,**核心内容反而被稀释**
- 结果:套话的微小变化(日期、文号、机构称谓)会让 SimHash 距离严重失真

**修正策略**:**对 v2.0 已实现的 `segment_used` 字段(核心段落)计算 SimHash,不对原始全文计算**。这恰好也是 E6 必须等 v2.0 `SegmentExtractor` 成熟后才能做的原因——它是 E6 的硬依赖。

#### 任务

- E6-S1-T1 在 `dwd_policy_analysis` 增加 `core_segment_simhash CHAR(16)` 字段(注意是核心段落的 simhash,**不是全文**)
- E6-S1-T2 入库时计算 simhash,基于 `segment_used` 字段而非 raw content
- E6-S1-T3 实现"近似政策查找"函数

#### 验收标准(AC)

- **AC1**:相似度识别(基于核心段落)
  - **Given** 两份核心政策内容仅数字不同的 LPR 公告(套话部分有日期文号差异)
  - **When** 基于 `segment_used` 计算 simhash 距离
  - **Then** 距离 ≤ 2(**而非基于全文,基于全文可能距离 > 8**)

### E6-S2 Diff 提取与 Prompt 设计

**作为** 政策分析引擎,**我希望** 仅把"差异部分"送入 LLM,**以便** 大幅减少 input token。

#### 任务

- E6-S2-T1 实现文本 diff 算法(基于 difflib 或 myers diff,在核心段落上计算)
- E6-S2-T2 设计 diff prompt:输入上期摘要 + 本期 diff,输出"边际变化"分析
- E6-S2-T3 集成到 `StagedAnalyzer`

#### 验收标准(AC)

- **AC1**:Diff 路径正确触发
  - **Given** 一份与上期高度相似(核心段落 simhash 距离 = 1)的货政报告
  - **When** 分析流程启动
  - **Then** 走 diff 路径,`analysis_path='llm_diff'`,输入 token 比完整分析少 ≥ 60%

## 实施原则(强制)

基于"系统已上线"的现实,严格执行以下原则:

1. **每次只上一项**(指真正切换主流量的动作);**可以多项并行准备**(代码、影子、配置)
2. **每项灰度 7 天**:小流量 → 全量,中间至少 1 周观察期
3. **每项有 rollback**:环境变量或 feature flag 可立即回退
4. **回归测试阻断**:金标准准确率不达标,**禁止推进**
5. **成本归因每周复盘**:对照基线,验证优化真实有效
6. **不破坏 v2.0 数据模型**:仅做字段增量,不修改已有字段语义
7. **任何依赖外部 API 行为的判断,必须有实测验证**(v1.1 新增):不沿用旧文档信息、不套用其他厂商政策、不凭直觉推断

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
