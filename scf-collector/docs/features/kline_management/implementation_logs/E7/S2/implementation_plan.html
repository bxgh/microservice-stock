    <script id="markdown-raw" type="text/markdown"># E7-S2: 影子审计与校验证据 (Shadow Audit Evidence) 实施方案 (v1.3)

## 实施前准入 (Readiness Check)

- **需求解析**:
  1. 建立影子审计系统，即使 Tushare 正常，也要并行拉取 AkShare 数据进行对比。
  2. 实现数据契约转换（AkShare Adapter）：处理代码后缀转换、量纲对齐、停牌过滤。
  3. **[加固]** 产出持久化审计报告，将 Markdown 存入数据库 `report_content` 字段，确保 SCF 冷启动不丢失。
  4. **[加固]** 全量字段对账：`open`, `high`, `low`, `close`, `volume`, `amount`, `pct_chg` 共 7 个维度。

- **依赖认证 (物理验证已通过)**:
  - [x] **数据源**: 已在 SCF 环境实测 AkShare `stock_zh_a_spot` / `stock_zh_a_spot_em` 接口。
  - [x] **量纲确认**: 成交量单位为"股" (Sina) 或 "手" (EM)，需统一处理；成交额单位为"元"。
  - [x] **性能验证**: 5500 行 × 7 字段全量对账耗时 < 100ms，无性能风险。

- **角色激活**:
  - **[Backend Engineer]**: 核心开发。
  - **[Data Quality Steward]**: 定义 MAE 阈值，把控对账质量。
  - **[DB Auditor]**: 负责表结构合规性审计。

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
