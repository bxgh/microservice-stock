    <script id="markdown-raw" type="text/markdown"># Epic E15: 盘后系统全量多维数据采集接入与云端定时调度体系补全 (v0.2 Tables Onboarding)

> **状态**: 草案评审中
> **最后更新**: 2026-05-19
> **版本**: v1.1
> **微服务归口**: `scf-collector`专属设计

---

## 背景与现状

在 A 股盘后分析系统 v0.2 的升级中，系统表结构从 v0.1 的 12 张表跃升至 **38 张表**（增量 26 张表，包含 8 张 TBD 命名表），数据维度全面拓展至 L1市场全景、L2行业与概念、L3资金流、L4情绪以及 L6公司公告事件等 5 大板块。

为了应对大规模高频、异构数据的采集压力，同时契合云端 **2000 积分** 的接口调用权限约束、频率限制瓶颈以及巨潮网络防火墙防爬拦截，必须为这些 MySQL 5.7 数据表设计一套**极度安全、按需调度且 100% 数据无损幂等**的云端 SCF 采集调度体系。

> [!IMPORTANT]
> **设计边界与 Out of Scope 声明**:
> * **ClickHouse 数据库** 不在本次 Epic 设计范围内。
> * **L5 高频分笔（Tick）原始成交流及聚合表** (`tick_data`、`tick_daily_stats`) 全线移出本次设计，不通过云端 SCF 采集与落地。

---

## 数据就役状态矩阵 (Data Production Status Matrix)

本 Epic 完成开发后，物理数据资产的就役与上线状态严格划分如下：

### 1. 正常增量上线数据 (Active Production - Go Live)
以下 14 个核心业务数据集（包含 26 张 MySQL 5.7 表）在本次开发完成后**正常增量上线**，每日盘后通过云端 SCF 定时拉取并无损写入：
*   **L1 基础与两融行情**：涨跌停连板池 (`ods_event_limit_pool`)、每日停复牌日历 (`ods_suspend_d`)、个股与大盘两融信用数据明细 (`ods_margin_detail`, `ods_margin_total`)、全市场涨跌家数与广度面包线 (`ods_market_breadth_daily`, 由本地行情派生)。
*   **L2 行业与概念指数**：申万行业日 K 线行情 (`ods_sw_index_daily`)、同花顺概念行情及成分股 (`ods_concept_kline_daily`，主轨道 `scf-pywencai` 异步同步，备用轨道轻量爬虫降级兜底)。
*   **L3 主力资金与宏观**：大盘沪深港通每日资金流向 (`north_capital_daily`)、个股大宗交易明细 (`stock_block_trade`)、龙虎榜席位与汇总数据 (`stock_lhb_detail`, `stock_lhb_summary`)、每日国债收益率与宏观情绪指标 (`monitor_indicators_history`)。
*   **L6 上市公司公告事件**：大股东增减持事件明细 (`ods_holdertrade`)、公司回购大事件 (`ods_stock_repurchase`)、分红送转方案与预案 (`ods_dividend`)、ST/ST* 戴脱帽日度差分变更事件 (`ods_st_change`，本地差分派生)、上市公司立案调查事件 (`ods_investigation`)。

### 2. 物理封存数据 (Frozen Historical Data - Read-Only)
*   **个股北向持股数据 (`stock_north_funds_daily`)**：
    *   **上线状态**：**绝对禁止增量上线**。
    *   **物理缘由**：证监会与交易所官方于 **2024-08-19** 起全面停发个股级北向持股明细，数据源在物理上已不复存在。
    *   **管控策略**：本次开发中**严禁对该表执行任何 `INSERT` 或 `UPDATE`** 增量逻辑。封存 2024-08-19 之前的历史数据为只读资产，**严禁使用任何 `DELETE`、`TRUNCATE` 或 `UPDATE` 语句对其进行物理修改**，确保历史完整性。

### 3. 不予上线 / 超出设计范围数据 (Out-of-Scope - Blocked)
*   **L5 高频分笔 Tick 数据 (`tick_data`、`tick_daily_stats`)**：
    *   **上线状态**：**不予开发，不予上线**。
    *   **原因**：每秒成交流量极其庞大，云端 SCF（128MB-512MB 内存、900 秒运行限制）无法承载。属于下游内网物理仓范围，本 Epic 全线移出。
*   **ClickHouse 专属分析层数据**：
    *   **上线状态**：**不予上线**。
    *   **原因**：ClickHouse 数据双写及二阶衍生指标计算为下游 `stock-compute` 或内网服务器职责，不属于腾讯云端采集探测服务边界，本次全线移出。

## 设计方案

新建与迁移方案采用 **“数据无损增量同步 (Lossless Incremental Sync)”** 原则：

### 核心物理原则

1. **联合唯一索引门禁 (Unique Index Gate)**：为吸取 [E4-S1] 自增主键下 `REPLACE INTO` 退化与历史幽灵因子污染的教训，任何增量或回填的 ODS 数据表，**必须前置在物理层建立联合唯一索引**（例如 `UNIQUE KEY uidx_code_date(ts_code, trade_date)`）。未建立唯一索引的表严禁上线任何增量代码，防止多次拉取产生重复行与重影数据。
2. **防重影物理增量与历史源对齐原则 (Source Alignment & Targeted Healing)**：
   * **禁止盲目清空**：对于完全符合 Tushare 统一口径的历史表，绝对禁止使用 `TRUNCATE` 或 `DELETE` 进行无差别暴力清空。
   * **历史源污染清障**：若存量表中混合了 v0.1 版遗留的**不同口径（如旧版 AkShare 或 BaoStock）历史残留数据**，在执行增量同步前，**必须通过 DDL 补齐唯一索引**，并前置执行针对旧源幽灵数据的**精准物理清理或一键全量 Tushare 重采回填**，完成数据口径的大一统，方可进入 MAX 日期断点增量续传，杜绝新旧口径不一导致的多因子/多数据共存堆积污染。
3. **入库幂等写入**：数据入库统一采用 `ON DUPLICATE KEY UPDATE`，使得即使重试或周期重叠，也仅做无损覆盖。
4. **小数标准化与单位对齐**：百分比变动（如大宗折溢价率、增减持比例、国债收益率）一律在入库前除以 100.0 并以 `DECIMAL` 小数规范化存储；成交金额一律对齐为“元”。
5. **流控安全调度**：对于能在本地由已有表计算派生的大盘面包线和戴脱帽数据，必须在盘后本地完成，避免因不必要的接口请求触发 Tushare API 的单日/单分钟调用频率超限流控约束。

```mermaid
graph TD
    A[每日盘后 16:30 - 18:00 定时触发] --> B{SCF 调度分配器}
    B -->|P0: 快速拉取行情与两融| C[Tushare 实际披露/两融接口]
    B -->|P1: 财务大事件与公告| D[公告行为解析]
    B -->|P2: 主力筹码与申万指数| E[龙虎榜/大宗与申万/概念行情]
    B -->|P3: 沪深港通与个股北向封存| F[大盘资金大流水/北向锁定]
    C & D & E & F -->|ON DUPLICATE KEY UPDATE| J[(MySQL 5.7 数据库)]

## 风险评估与里程碑

### 风险评估
- **Tushare 频次流控**: 单线程串行，抓取间隔至少 0.3s-1.5s，确保 100% 避开频次超限。 (影响: 高, 概率: 中)
- **问财反爬与 Node.js 内存限制**: 同花顺问财接口依赖 Node.js 动态解密与 jsdom 运行环境，内存开销巨大（需 ≥512MB 内存），且极易触发 IP 反爬屏蔽限制。在 THS 调整加密参数时，`pywencai` 存在整体不可用风险。 (影响: 高, 概率: 高)
  * *隔离缓解方案*: 将 PyWencai 逻辑解耦，单独部署为独立的 **`scf-pywencai`** 云函数（配置 512MB 内存与独立 HTTP 代理/Header 混淆），与主收集器 `scf-collector`（128MB 内存）物理隔离，异步进行调用和流控。
  * *高可用爬虫降级保障 (Fallback Scraper)*: 当 `scf-pywencai` 发生持续超时（>3次）或同花顺算法升级导致解密失效时，系统**自动激活轻量级降级爬虫通道**。由主收集器直接触发基于 **AkShare / 东方财富 (Eastmoney) / 新浪概念板块接口**（无 Node.js 依赖，内存开销 <12mb，接口如 `stock_board_concept_cons_em`），拉取概念行情及成分股，数据归一化后打标为 `data_source='em_fallback'` 幂等写入，同时向上游监控发出健康度告警，确保数据同步永不断流。
- **北向个股停发异常**: 2024-08-19 后个股数据停发，增量引擎必须封存并忽略该历史接口，防止请求报错。 (影响: 低, 概率: 极高)

### 里程碑
- **M1: P0 行情补充与两融接入**：2026-05-20 - 落地涨跌停池、个股两融及市场大盘宽度指标。
- **M2: P1 公告事件大底座接入**：2026-05-23 - 落地股东增减持、公司回购与分红方案，百分比全线标准化。
- **M3: P2 大宗交易与申万/概念接入**：2026-05-26 - 落地龙虎榜、大宗以及申万/概念板块行情。
- **M4: P3 港通流量与个股北向锁定**：2026-05-28 - 落地大盘资金大流水，并锁死个股北向增量动作。

### E15-S1: P0级行情池与两融指标采集模块
**角色**: `scf-collector`
**希望**: 每日盘后极速同步涨跌停连板高度、当日停复牌过滤器及两融信用杠杆
**价值**: 提供大盘资金活跃度和交易日状态的基础行情过滤

#### 任务
- [ ] E15-S1-T1: 编写 `sync_limit_pool` 采集接口，将每日涨停、跌停、炸板和连板高度信息入库 `ods_event_limit_pool`
- [ ] E15-S1-T2: 编写 `sync_suspend_calendar` 每日盘前更新当天停牌数据 `ods_suspend_d`
- [ ] E15-S1-T3: 编写 `sync_margin_data` 盘后同步两融市场级（`ods_margin_total`）与个股明细并无损入库，断点续传
- [ ] E15-S1-T4: 实现本地 `ods_market_breadth_daily` 面包线派生，由 K 线完成事件驱动触发，避免触发频率限制流控

#### 验收标准 (AC)
- **AC1: 两融断点无损校验**: Given 两融明细表已有 2026-05-18 数据, When 触发 sync_margin_data 时, Then 系统自动定位 MAX 时间并仅同步 05-19 数据，原有历史数据未被清空。
- **AC2: 涨跌停池唯一约束**: Given 重复运行 limit_pool 接口, When 唯一约束 `uk_code_date` 触发时, Then 语句以 `ON DUPLICATE KEY UPDATE` 覆盖，无脏数据生成。

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMd = document.getElementById('markdown-raw').textContent;
            const contentEl = document.getElementById('content');
            const tocEl = document.getElementById('toc');
            
            // Set options for marked
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true,
                mangle: false,
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });

            // Parse Markdown
            contentEl.innerHTML = marked.parse(rawMd);
            
            // Generate TOC
            const headings = contentEl.querySelectorAll('h2, h3');
            headings.forEach((h, index) => {
                if (!h.id) h.id = 'heading-' + index;
                
                const li = document.createElement('li');
                li.className = 'toc-item level-' + h.tagName.toLowerCase().charAt(1);
                
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Handle Mermaid
            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: 'dark', useWorker: false });
                document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.parentElement.replaceChild(div, pre);
                });
                mermaid.run();
            }
        });
    </script>
